<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>COMICO-RDC - Gestion en Ligne Firebase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand mb-0 h1"><i class="fa fa-school me-2"></i> COMICO-RDC (Base de Données Firebase)</span>
</nav>

<div class="container my-5">
    <div class="row">
        <!-- Formulaire d'enregistrement -->
        <div class="col-md-5 mb-4">
            <div class="card shadow border-0 p-4">
                <h4 class="text-warning fw-bold mb-3">Enregistrer une Madras</h4>
                <form id="schoolForm" onsubmit="saveSchoolToFirebase(event)">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nom de la Madras :</label>
                        <input type="text" id="schoolName" class="form-control" placeholder="Ex: Madras Al-Rahma" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Province :</label>
                        <input type="text" id="schoolProvince" class="form-control" placeholder="Ex: Kinshasa" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold text-dark">
                        <i class="fa fa-cloud-upload-alt me-1"></i> Enregistrer sur Firebase
                    </button>
                </form>
            </div>
        </div>

        <!-- Liste affichée -->
        <div class="col-md-7">
            <div class="card shadow border-0 p-4">
                <h4 class="text-dark fw-bold mb-3">Madras Enregistrées en Ligne</h4>
                <div id="statusMessage" class="alert alert-info py-2 small">Connexion à Firebase en cours...</div>
                <div id="schoolsList" class="list-group">
                    <!-- Les écoles s'afficheront ici -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- SDK Firebase (Modules officiels) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBa_X5rgTc5SAD1Ddn4T-TtD5h82o3IeIY",
    authDomain: "comico-rdc.firebaseapp.com",
    projectId: "comico-rdc",
    storageBucket: "comico-rdc.firebasestorage.app",
    messagingSenderId: "664769138510",
    appId: "1:664769138510:web:e9471ef2214a156284d81f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Rendre les fonctions globales pour le formulaire
  window.db = db;
  window.FirestoreTools = { doc, getDoc, setDoc };

  // Charger les données dès l'ouverture
  loadSchoolsFromFirebase();
</script>

<script>
  async function loadSchoolsFromFirebase() {
    const statusDiv = document.getElementById('statusMessage');
    const listDiv = document.getElementById('schoolsList');

    // Petite attente pour s'assurer que window.db est initialisé par le module
    setTimeout(async () => {
        if (!window.db) {
            statusDiv.className = "alert alert-danger py-2 small";
            statusDiv.innerText = "Erreur : Firebase n'a pas pu se charger (vérifiez votre connexion ou l'utilisation d'un serveur local type Live Server).";
            return;
        }

        try {
            const docRef = window.FirestoreTools.doc(window.db, "comicoData", "mainStore");
            const docSnap = await window.FirestoreTools.getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                renderList(data.schools || []);
                statusDiv.className = "alert alert-success py-2 small";
                statusDiv.innerText = "Connecté à Firebase - Données chargées avec succès.";
            } else {
                statusDiv.className = "alert alert-warning py-2 small";
                statusDiv.innerText = "Connexion établie, mais aucune donnée enregistrée pour le moment.";
                renderList([]);
            }
        } catch (error) {
            statusDiv.className = "alert alert-danger py-2 small";
            statusDiv.innerText = "Erreur de lecture Firebase : " + error.message;
        }
    }, 1000);
  }

  async function saveSchoolToFirebase(e) {
    e.preventDefault();
    const name = document.getElementById('schoolName').value.trim();
    const province = document.getElementById('schoolProvince').value.trim();
    const statusDiv = document.getElementById('statusMessage');

    if (!window.db) {
        alert("Firebase n'est pas prêt.");
        return;
    }

    try {
        statusDiv.className = "alert alert-info py-2 small";
        statusDiv.innerText = "Enregistrement en cours sur Firebase...";

        const docRef = window.FirestoreTools.doc(window.db, "comicoData", "mainStore");
        
        // Récupérer d'abord les données existantes
        const docSnap = await window.FirestoreTools.getDoc(docRef);
        let schools = [];
        if (docSnap.exists() && docSnap.data().schools) {
            schools = docSnap.data().schools;
        }

        // Ajouter la nouvelle école
        schools.push({
            id: 'SCH-' + Date.now(),
            name: name,
            province: province,
            code: 'MAD-' + Math.floor(1000 + Math.random() * 9000)
        });

        // Sauvegarder dans Firestore
        await window.FirestoreTools.setDoc(docRef, { schools: schools });

        // Mettre à jour l'affichage
        renderList(schools);
        document.getElementById('schoolForm').reset();
        statusDiv.className = "alert alert-success py-2 small";
        statusDiv.innerText = "Madras enregistrée et sauvegardée en ligne sur Firebase avec succès !";
    } catch (error) {
        statusDiv.className = "alert alert-danger py-2 small";
        statusDiv.innerText = "Erreur d'enregistrement : " + error.message;
    }
  }

  function renderList(schools) {
    const listDiv = document.getElementById('schoolsList');
    if (!schools || schools.length === 0) {
        listDiv.innerHTML = '<div class="text-muted text-center py-3">Aucune Madras enregistrée.</div>';
        return;
    }

    listDiv.innerHTML = schools.map(s => `
        <div class="list-group-item list-group-item-action mb-2 border rounded shadow-sm">
            <h5 class="mb-1 text-warning fw-bold">${s.name}</h5>
            <p class="mb-1 small text-muted"><b>Province :</b> ${s.province}</p>
            <span class="badge bg-dark">Code : ${s.code}</span>
        </div>
    `).join('');
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
