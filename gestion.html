    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(INITIAL_STATE);
        return { ...structuredClone(INITIAL_STATE), ...JSON.parse(raw) };
      } catch {
        return structuredClone(INITIAL_STATE);
      }
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {}
    }

    function notify(msg) {
      state.notification = msg;
      saveState();
      renderApp();
      setTimeout(() => {
        state.notification = null;
        renderApp();
      }, 3800);
    }

      const now = new Date();
      const ts = `${now.toISOString().split('T')[0]} ${now.toTimeString().split(' ')[0]} WAT`;
      state.auditLogs.unshift({
        id: `AUD-${Math.floor(10000 + Math.random() * 90000)}`,
        timestamp: ts,
        acteur: 'Chargé de l’Administration',
        role: 'Chargé de l’Administration',
        province,
        module,
        action,
        details,
        ip: '197.242.118.42'
      });
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function downloadJson(filename, data) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Générateur de matrice QR visuelle déterministe à partir du texte
    function buildQrSvg(text, size = 54) {
      const n = 15;
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      const cell = size / n;
      let rects = `<rect width="${size}" height="${size}" fill="#ffffff"/>`;

      const drawFinder = (gx, gy) => {
        rects += `<rect x="${gx * cell}" y="${gy * cell}" width="${5 * cell}" height="${5 * cell}" fill="#064e3b"/>`;
        rects += `<rect x="${(gx + 1) * cell}" y="${(gy + 1) * cell}" width="${3 * cell}" height="${3 * cell}" fill="#ffffff"/>`;
        rects += `<rect x="${(gx + 2) * cell}" y="${(gy + 2) * cell}" width="${1 * cell}" height="${1 * cell}" fill="#064e3b"/>`;
      };

      drawFinder(0, 0);
      drawFinder(n - 5, 0);
      drawFinder(0, n - 5);

      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          const inTopLeft = r < 5 && c < 5;
          const inTopRight = r < 5 && c >= n - 5;
          const inBottomLeft = r >= n - 5 && c < 5;
          if (inTopLeft || inTopRight || inBottomLeft) continue;
          const bit = ((hash >>> ((r * n + c) % 31)) ^ (r * 7 + c * 13 + text.length)) & 1;
          if (bit === 1) {
            rects += `<rect x="${c * cell}" y="${r * cell}" width="${cell}" height="${cell}" fill="#0f172a"/>`;
          }
        }
      }

      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="rounded border border-slate-300 bg-white shrink-0" aria-label="QR Code">${rects}</svg>`;
    }

    // --- Actions Point 1 : Organigramme Hiérarchique ---
    function handleSaveOrgan(e) {
      e.preventDefault();
      const f = state.organForm;
      if (!f.nom.trim()) return;

      if (f.id) {
        state.organs = state.organs.map((o) => (o.id === f.id ? { ...o, ...f, effectifBureau: Number(f.effectifBureau) || 1 } : o));
        state.selectedOrganId = f.id;
        addAudit('Structure et organes', 'MODIFICATION_ORGANE', `Modification de ${f.nom} (${f.niveau})`, f.province);
        notify('Organe et autorité hiérarchique modifiés et enregistrés.');
      } else {
        const newId = `ORG-${Date.now()}`;
        const created = {
          ...f,
          id: newId,
          code: f.code.trim() || `COMICO-${f.niveau.slice(0, 3).toUpperCase()}-${Math.floor(10 + Math.random() * 89)}`,
          effectifBureau: Number(f.effectifBureau) || 1,
          publie: false
        };
        state.organs.push(created);
        state.selectedOrganId = newId;
        addAudit('Structure et organes', 'ENREGISTREMENT_ORGANE', `Enregistrement de ${created.nom} (${created.niveau})`, created.province);
        notify('Nouvel organe et autorité hiérarchique enregistrés.');
      }

      state.organForm = {
        id: '',
        code: '',
        nom: '',
        niveau: 'Provincial',
        parentId: state.organs[0]?.id || '',
        province: 'Kinshasa',
        urbainTerritorial: '',
        mosquee: '',
        siege: '',
        autorite: '',
        mandat: '2025 - 2029',
        statut: 'Actif',
        effectifBureau: 9
      };
      saveState();
      renderApp();
    }

    function editOrgan(id) {
      const target = state.organs.find((o) => o.id === id);
      if (!target) return;
      state.organForm = { ...target };
      state.selectedOrganId = id;
      saveState();
      renderApp();
    }

    function deleteOrgan(id) {
      if (state.organs.length <= 1) {
        notify('Impossible de supprimer le dernier organe racine.');
        return;
      }
      state.organs = state.organs.filter((o) => o.id !== id && o.parentId !== id);
      if (state.selectedOrganId === id) {
        state.selectedOrganId = state.organs[0]?.id || '';
      }
      addAudit('Structure et organes', 'SUPPRESSION_ORGANE', `Suppression de l'organe ${id}`);
      notify('Organe supprimé.');
      saveState();
      renderApp();
    }

      const p1 = String(Math.floor(1000 + Math.random() * 9000));

      notify(`ID National (${generatedId}) et Code Secret (${generatedSecret}) générés.`);

    function handleSaveMember(e) {
      e.preventDefault();
      const f = state.memberForm;
      if (!f.nom.trim() || !f.prenom.trim()) return;
      const idNat = f.idNational.trim() || generateSystemIdNational();
      const codeSecret = f.codeSecret.trim() || generateSystemCodeSecret();

      const record = {
        ...f,
        idNational: idNat,
        codeSecret,
        statut: 'Actif',
        dateAdhesion: new Date().toISOString().split('T')[0]
      };

      const exists = state.members.some((m) => m.idNational === idNat);
      if (exists) {
        state.members = state.members.map((m) => (m.idNational === idNat ? record : m));
      } else {
        state.members.unshift(record);
      }
      state.selectedMemberId = idNat;
      addAudit('Membres', 'ENREGISTREMENT_STOCKAGE_MEMBRE', `Enregistrement et stockage du membre ${record.prenom} ${record.nom} (${idNat})`, record.provinceResidence);
      notify('Membre enregistré et stocké avec ID, Code Secret & Carte.');
      state.memberForm = {
        idNational: '',
        codeSecret: '',
        nom: '',
        postnom: '',
        prenom: '',
        telephone: '+243 ',
        provinceResidence: 'Kinshasa',

        professionCompetence: '',
        image: ''

      saveState();
      renderApp();
    }

        acteNomination: acte,
        arreteSigne: true
      };

      if (f.id) {
        state.leaders = state.leaders.map((l) => (l.id === f.id ? entry : l));
        addAudit('Responsables religieux', 'MODIFICATION_RESPONSABLE', `Mise à jour de ${entry.nom} (${acte})`, entry.province);
        notify('Responsable religieux mis à jour.');
      } else {
        state.leaders.unshift(entry);
        addAudit('Responsables religieux', 'ENREGISTREMENT_ARRETE', `Enregistrement de ${entry.nom} sous arrêté ${acte}`, entry.province);
        notify(`Responsable religieux enregistré avec l'Arrêté N° ${acte}.`);
      }

      state.selectedLeaderId = id;
      state.leaderForm = {
        id: '',
        nom: '',
        fonction: 'Imam Khatib Titulaire',
        qualification: '',
        province: 'Kinshasa',

      renderApp();

      addAudit('Responsables religieux', 'SUPPRESSION_RESPONSABLE', `Suppression du responsable ${id}`);

        case 'members': return renderMembers();
        case 'leaders': return renderLeaders();
        case 'finance': return renderOtherSection('5. Finance & Zakat', 'Suivi financier et Zakat', state.transactions.map(t => `${t.id} — ${t.categorie} : $${t.montantUSD} USD (${t.source})`));
        case 'events': return renderOtherSection('6. Événements et fêtes', 'Calendrier communautaire', state.events.map(e => `${e.titre} — ${e.dateGregorien} / ${e.dateHijri} (${e.lieu})`));
        case 'certificates': return renderOtherSection('7. Attestations religieuses', 'Actes officiels', state.certificates.map(c => `${c.id} — ${c.type} : ${c.beneficiaire}`));
        case 'audit': return renderOtherSection("8. Journal d'audit", 'Traçabilité des opérations', state.auditLogs.map(a => `${a.timestamp} — [${a.module}] ${a.action} : ${a.details}`));
