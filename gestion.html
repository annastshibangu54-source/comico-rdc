    function openAuditIdb() {
      if (auditIdbPromise) return auditIdbPromise;
      auditIdbPromise = new Promise((resolve) => {
        try {
          if (typeof indexedDB === 'undefined') return resolve(null);
          const req = indexedDB.open(AUDIT_IDB_NAME, 1);
          req.onupgradeneeded = () => {
            const dbIdb = req.result;
            if (!dbIdb.objectStoreNames.contains(AUDIT_IDB_STORE)) {
              dbIdb.createObjectStore(AUDIT_IDB_STORE);
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (_) {
          resolve(null);
        }
      });
      return auditIdbPromise;
    }

    async function writeAuditLocalCache(logs, formData) {
      try {
        const dbIdb = await openAuditIdb();
        if (!dbIdb) return;
        const tx = dbIdb.transaction(AUDIT_IDB_STORE, 'readwrite');
        const store = tx.objectStore(AUDIT_IDB_STORE);
        store.put({
          auditLogs: deepClone(logs || []),
          auditForm: deepClone(formData || {}),
          updatedAt: Date.now()
        }, AUDIT_IDB_KEY);
      } catch (_) {}
    }

    async function readAuditLocalCache() {
      try {
        const dbIdb = await openAuditIdb();
        if (!dbIdb) return null;
        return await new Promise((resolve) => {
          const tx = dbIdb.transaction(AUDIT_IDB_STORE, 'readonly');
          const store = tx.objectStore(AUDIT_IDB_STORE);
          const req = store.get(AUDIT_IDB_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (_) {
        return null;
      }
    }

    function mergeAuditLogsWithCache(cachedLogs) {
      if (!Array.isArray(cachedLogs) || !cachedLogs.length) return;
      const cacheById = new Map(cachedLogs.map((item) => [item.id, item]));
      const currentIds = new Set((state.auditLogs || []).map((item) => item.id));

      const mergedExisting = (state.auditLogs || []).map((item) => {
        const cached = cacheById.get(item.id);
        if (!cached) return item;
        const pickMedia = (curVal, cacheVal) => {
          if (typeof curVal === 'string' && curVal.startsWith('http')) return curVal;
          if (typeof cacheVal === 'string' && cacheVal.startsWith('http')) return cacheVal;
          return curVal || cacheVal || '';
        };
        return {
          ...item,
          audio: pickMedia(item.audio, cached.audio),
          video: pickMedia(item.video, cached.video),
          image: pickMedia(item.image, cached.image)
        };
      });

      const missingFromState = cachedLogs.filter((item) => !currentIds.has(item.id));
      state.auditLogs = [...missingFromState, ...mergedExisting];
    }

    function mergeWithInitialState(parsed) {
      const base = deepClone(INITIAL_STATE);
      if (!parsed || typeof parsed !== 'object') return base;
      const merged = {
        ...base,
        ...parsed,
        splitRules: { ...base.splitRules, ...(parsed.splitRules || {}) }
      };
      if (!merged.activeTab) merged.activeTab = 'dashboard';
      if (typeof merged.mobileMenuOpen !== 'boolean') merged.mobileMenuOpen = false;
      if (typeof merged.topNavOpen !== 'boolean') merged.topNavOpen = false;
      if (typeof merged.mosqueSearch !== 'string') merged.mosqueSearch = '';
      if (!Array.isArray(merged.organs) || !merged.organs.length) merged.organs = base.organs;
      if (!Array.isArray(merged.mosques)) merged.mosques = base.mosques;
      if (!Array.isArray(merged.members)) merged.members = base.members;
      if (!Array.isArray(merged.leaders)) merged.leaders = base.leaders;
      if (!Array.isArray(merged.transactions)) merged.transactions = base.transactions;
      if (!Array.isArray(merged.events)) merged.events = base.events;
      if (!Array.isArray(merged.certificates)) merged.certificates = base.certificates;
      if (!Array.isArray(merged.auditLogs)) merged.auditLogs = base.auditLogs;
      if (!Array.isArray(merged.waqfs)) merged.waqfs = base.waqfs;
      if (!Array.isArray(merged.hajjPilgrims)) merged.hajjPilgrims = base.hajjPilgrims;
      return merged;
    }

    function stripHeavyMediaForStorage(rawState, maxDataLength = 350000) {
      const clean = { ...rawState, notification: null, mobileMenuOpen: false, topNavOpen: false };
      const isHeavyDataOrBlob = (val) => {
        if (typeof val !== 'string') return false;
        if (val.startsWith('blob:')) return true;
        if (val.startsWith('data:') && val.length > maxDataLength) return true;
        return false;
      };
      const light = deepClone(clean);
      light.mosques = (light.mosques || []).map((m) => ({ ...m, image: isHeavyDataOrBlob(m.image) ? '' : m.image }));
      light.members = (light.members || []).map((m) => ({ ...m, image: isHeavyDataOrBlob(m.image) ? '' : m.image }));
      light.leaders = (light.leaders || []).map((l) => ({ ...l, photo: isHeavyDataOrBlob(l.photo) ? '' : l.photo }));
      light.transactions = (light.transactions || []).map((t) => ({ ...t, image: isHeavyDataOrBlob(t.image) ? '' : t.image }));
      light.events = (light.events || []).map((ev) => ({ ...ev, image: isHeavyDataOrBlob(ev.image) ? '' : ev.image }));
      light.certificates = (light.certificates || []).map((c) => ({
        ...c,
        imageEpoux: isHeavyDataOrBlob(c.imageEpoux) ? '' : c.imageEpoux,
        imageEpouse: isHeavyDataOrBlob(c.imageEpouse) ? '' : c.imageEpouse,
        imageUnique: isHeavyDataOrBlob(c.imageUnique) ? '' : c.imageUnique
      }));
      light.auditLogs = (light.auditLogs || []).map((a) => ({
        ...a,
        audio: isHeavyDataOrBlob(a.audio) ? '' : a.audio,
        video: isHeavyDataOrBlob(a.video) ? '' : a.video,
        image: isHeavyDataOrBlob(a.image) ? '' : a.image
      }));
      light.hajjPilgrims = (light.hajjPilgrims || []).map((h) => ({ ...h, photo: isHeavyDataOrBlob(h.photo) ? '' : h.photo }));
      if (light.mosqueForm) light.mosqueForm.image = isHeavyDataOrBlob(light.mosqueForm.image) ? '' : light.mosqueForm.image;
      if (light.memberForm) light.memberForm.image = isHeavyDataOrBlob(light.memberForm.image) ? '' : light.memberForm.image;
      if (light.leaderForm) light.leaderForm.photo = isHeavyDataOrBlob(light.leaderForm.photo) ? '' : light.leaderForm.photo;
      if (light.financeForm) light.financeForm.image = isHeavyDataOrBlob(light.financeForm.image) ? '' : light.financeForm.image;
      if (light.eventForm) light.eventForm.image = isHeavyDataOrBlob(light.eventForm.image) ? '' : light.eventForm.image;
      if (light.certificateForm) {
        light.certificateForm.imageEpoux = isHeavyDataOrBlob(light.certificateForm.imageEpoux) ? '' : light.certificateForm.imageEpoux;
        light.certificateForm.imageEpouse = isHeavyDataOrBlob(light.certificateForm.imageEpouse) ? '' : light.certificateForm.imageEpouse;
        light.certificateForm.imageUnique = isHeavyDataOrBlob(light.certificateForm.imageUnique) ? '' : light.certificateForm.imageUnique;
      }
      if (light.auditForm) {
        light.auditForm.audio = isHeavyDataOrBlob(light.auditForm.audio) ? '' : light.auditForm.audio;
        light.auditForm.video = isHeavyDataOrBlob(light.auditForm.video) ? '' : light.auditForm.video;
        light.auditForm.image = isHeavyDataOrBlob(light.auditForm.image) ? '' : light.auditForm.image;
      }
      if (light.hajjForm) light.hajjForm.photo = isHeavyDataOrBlob(light.hajjForm.photo) ? '' : light.hajjForm.photo;
      return light;
    }

    function readLocalBackup() {
      try {
        const raw = localStorage.getItem(LOCAL_BACKUP_KEY);
        if (!raw) return null;
        return mergeWithInitialState(JSON.parse(raw));
      } catch (_) {
        return null;
      }
    }

    function writeLocalBackup(rawState) {
      try {
        const lightweight = stripHeavyMediaForStorage(rawState, 350000);
        localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(lightweight));
      } catch (_) {
        try {
          const compact = stripHeavyMediaForStorage(rawState, 40000);
          localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(compact));
        } catch (__) {}
      }
    }

    let state = readLocalBackup() || deepClone(INITIAL_STATE);

    readAuditLocalCache().then((cached) => {
      if (!cached) return;
      mergeAuditLogsWithCache(cached.auditLogs);
      if (cached.auditForm && typeof cached.auditForm === 'object') {
        state.auditForm = {
          ...state.auditForm,
          ...cached.auditForm,
          audio: cached.auditForm.audio || state.auditForm.audio || '',
          video: cached.auditForm.video || state.auditForm.video || '',
          image: cached.auditForm.image || state.auditForm.image || ''
        };
      }
      renderApp();
    }).catch(() => {});

    function isPersistentAuditMedia(val) {
      if (typeof val !== 'string' || !val) return false;
      if (val.startsWith('blob:')) return false;
      if (val.startsWith('https://') || val.startsWith('http://')) return true;
      if (val.startsWith('data:') && val.length <= 850000) return true;
      return false;
    }

    function buildSectionData(sectionKey, rawState) {
      if (sectionKey === 'audit') {
        const auditClean = { ...rawState, notification: null, mobileMenuOpen: false, topNavOpen: false };
        const keepAuditMedia = (val) => (isPersistentAuditMedia(val) ? val : '');
        const items = (auditClean.auditLogs || []).map((a) => ({
          ...a,
          audio: keepAuditMedia(a.audio),
          video: keepAuditMedia(a.video),
          image: keepAuditMedia(a.image)
        }));
        return { items, selectedId: auditClean.selectedAuditId || '' };
      }
      const clean = stripHeavyMediaForStorage(rawState, 350000);
      switch (sectionKey) {
        case 'organs':
          return { items: clean.organs || [], selectedId: clean.selectedOrganId || '' };
        case 'mosques':
          return { items: clean.mosques || [], search: clean.mosqueSearch || '' };
        case 'members':
          return { items: clean.members || [], selectedId: clean.selectedMemberId || '' };
        case 'leaders':
          return { items: clean.leaders || [], selectedId: clean.selectedLeaderId || '' };
        case 'finance':
          return { items: clean.transactions || [], selectedId: clean.selectedTransactionId || '' };
        case 'events':
          return { items: clean.events || [], selectedId: clean.selectedEventId || '' };
        case 'certificates':
          return { items: clean.certificates || [], selectedId: clean.selectedCertificateId || '' };
        case 'waqf':
          return { items: clean.waqfs || [], selectedId: clean.selectedWaqfId || '' };
        case 'hajj':
          return { items: clean.hajjPilgrims || [], selectedId: clean.selectedHajjId || '' };
        case 'admin':
          return { splitRules: clean.splitRules || { locale: 50, provinciale: 30, nationale: 20 } };
        default:
          return null;
      }
    }

    function applySectionData(sectionKey, data) {
      if (!data || typeof data !== 'object') return;
      switch (sectionKey) {
        case 'organs':
          if (Array.isArray(data.items) && data.items.length) state.organs = data.items;
          if (typeof data.selectedId === 'string') state.selectedOrganId = data.selectedId;
          break;
        case 'mosques':
          if (Array.isArray(data.items)) state.mosques = data.items;
          if (typeof data.search === 'string') state.mosqueSearch = data.search;
          break;
        case 'members':
          if (Array.isArray(data.items)) state.members = data.items;
          if (typeof data.selectedId === 'string') state.selectedMemberId = data.selectedId;
          break;
        case 'leaders':
          if (Array.isArray(data.items)) state.leaders = data.items;
          if (typeof data.selectedId === 'string') state.selectedLeaderId = data.selectedId;
          break;
        case 'finance':
          if (Array.isArray(data.items)) state.transactions = data.items;
          if (typeof data.selectedId === 'string') state.selectedTransactionId = data.selectedId;
          break;
        case 'events':
          if (Array.isArray(data.items)) state.events = data.items;
          if (typeof data.selectedId === 'string') state.selectedEventId = data.selectedId;
          break;
        case 'certificates':
          if (Array.isArray(data.items)) state.certificates = data.items;
          if (typeof data.selectedId === 'string') state.selectedCertificateId = data.selectedId;
          break;
        case 'audit':
          if (Array.isArray(data.items)) {
            const localById = new Map((state.auditLogs || []).map((item) => [item.id, item]));
            const remoteIds = new Set(data.items.map((item) => item.id));
            const mergedRemote = data.items.map((remoteItem) => {
              const localItem = localById.get(remoteItem.id);
              if (!localItem) return remoteItem;
              const pickBestMedia = (remoteVal, localVal) => {
                if (typeof remoteVal === 'string' && remoteVal.startsWith('http')) return remoteVal;
                if (typeof localVal === 'string' && localVal.startsWith('http')) return localVal;
                return remoteVal || localVal || '';
              };
              return {
                ...remoteItem,
                audio: pickBestMedia(remoteItem.audio, localItem.audio),
                video: pickBestMedia(remoteItem.video, localItem.video),
                image: pickBestMedia(remoteItem.image, localItem.image)
              };
            });
            const unsyncedLocal = (state.auditLogs || []).filter((item) => !remoteIds.has(item.id));
            state.auditLogs = [...unsyncedLocal, ...mergedRemote];
            writeAuditLocalCache(state.auditLogs, state.auditForm);
          }
          if (typeof data.selectedId === 'string') state.selectedAuditId = data.selectedId;
          break;
        case 'waqf':
          if (Array.isArray(data.items)) state.waqfs = data.items;
          if (typeof data.selectedId === 'string') state.selectedWaqfId = data.selectedId;
          break;
        case 'hajj':
          if (Array.isArray(data.items)) state.hajjPilgrims = data.items;
          if (typeof data.selectedId === 'string') state.selectedHajjId = data.selectedId;
          break;
        case 'admin':
          if (data.splitRules && typeof data.splitRules === 'object') {
            state.splitRules = { ...state.splitRules, ...data.splitRules };
          }
          break;
      }
    }

    async function pushSectionToFirestore(sectionKey) {
      const refDoc = docRefs[sectionKey];
      if (!refDoc || !auth) return false;
      if (syncingFromFirebase.has(sectionKey) || savingToFirebase.has(sectionKey)) return true;

      savingToFirebase.add(sectionKey);
      try {
        if (!firebaseUser) {
          await signInAnonymously(auth);
        }
        let sectionData = buildSectionData(sectionKey, state);
        let serialized = JSON.stringify(sectionData);
        if (serialized.length > 920000) {
          const compactState = stripHeavyMediaForStorage(state, 20000);
          sectionData = buildSectionData(sectionKey, compactState);
          serialized = JSON.stringify(sectionData);
        }
        if (serialized.length > 980000) {
          notify(`Document "${RUBRIQUE_DOCS[sectionKey]}" trop volumineux (>980 Ko) : réduisez les pièces jointes.`);
          return false;
        }
        if (serialized === lastSerializedBySection[sectionKey]) {
          cloudStatus = "Synchronisé";
          return true;
        }

        await setDoc(refDoc, {
          rubrique: sectionKey,
          data: sectionData,
          updatedAt: new Date().toISOString()
        }, { merge: true });

        lastSerializedBySection[sectionKey] = serialized;
        cloudStatus = "Synchronisé";
        return true;
      } catch (err) {
        console.error(`Firestore write error (${sectionKey}):`, err);
        cloudStatus = "Erreur cloud";
        notify(`Échec synchro Firestore (${RUBRIQUE_DOCS[sectionKey]}) : ${err?.code || err?.message || 'vérifiez les règles Firestore'}`);
        return false;
      } finally {
        savingToFirebase.delete(sectionKey);
      }
    }

    async function pushAllSectionsToFirestore() {
      for (const sectionKey of Object.keys(RUBRIQUE_DOCS)) {
        await pushSectionToFirestore(sectionKey);
      }
    }

    function saveState(sectionsToSync = null) {
      try {
        writeLocalBackup(state);
      } catch (_) {}

      const keys = Array.isArray(sectionsToSync) && sectionsToSync.length
        ? sectionsToSync
        : Object.keys(RUBRIQUE_DOCS);

      if (keys.includes('audit')) {
        writeAuditLocalCache(state.auditLogs, state.auditForm);
      }

      for (const key of keys) {
        if (!docRefs[key]) continue;
        if (firestoreTimers[key]) clearTimeout(firestoreTimers[key]);
        const delay = key === 'audit' ? 50 : 350;
        firestoreTimers[key] = setTimeout(() => {
          pushSectionToFirestore(key).catch(() => {});
        }, delay);
      }
      return true;
    }

    function applyRemoteSectionData(sectionKey, remoteDataObj) {
      const serialized = JSON.stringify(remoteDataObj || {});
      syncingFromFirebase.add(sectionKey);
      try {
        applySectionData(sectionKey, remoteDataObj);
        lastSerializedBySection[sectionKey] = serialized;
        delete pendingRemoteBySection[sectionKey];
        writeLocalBackup(state);
        cloudStatus = "Synchronisé";
      } catch (_) {
      } finally {
        syncingFromFirebase.delete(sectionKey);
        renderApp();
      }
    }

    function flushPendingRemoteIfIdle() {
      const activeTag = document.activeElement?.tagName;
      if (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT') return;
      const keys = Object.keys(pendingRemoteBySection);
      for (const key of keys) {
        const data = pendingRemoteBySection[key];
        delete pendingRemoteBySection[key];
        applyRemoteSectionData(key, data);
      }
    }

    function initFirebaseSync() {
      if (!auth || !db || !Object.keys(docRefs).length) return;

      document.addEventListener('focusout', () => {
        setTimeout(() => flushPendingRemoteIfIdle(), 50);
      });

      onAuthStateChanged(auth, async (user) => {
        firebaseUser = user;
        if (!user) return;

        let anyRemoteFound = false;

        for (const [sectionKey, refDoc] of Object.entries(docRefs)) {
          try {
            const snap = await getDoc(refDoc);
            if (snap.exists() && snap.data()?.data && !savingToFirebase.has(sectionKey)) {
              anyRemoteFound = true;
              const remoteData = snap.data().data;
              const serialized = JSON.stringify(remoteData);
              if (serialized !== lastSerializedBySection[sectionKey]) {
                applySectionData(sectionKey, remoteData);
                lastSerializedBySection[sectionKey] = serialized;
              }
            }
          } catch (err) {
            console.warn(`Firestore read warning (${sectionKey}):`, err);
          }
        }

        // Migration éventuelle depuis l'ancien document unique gestion_main_state
        if (!anyRemoteFound && legacyDocRef) {
          try {
            const legacySnap = await getDoc(legacyDocRef);
            if (legacySnap.exists() && legacySnap.data()?.payload) {
              const parsedLegacy = mergeWithInitialState(JSON.parse(legacySnap.data().payload));
              state = { ...parsedLegacy, activeTab: state.activeTab || 'dashboard', notification: null };
              writeLocalBackup(state);
              await pushAllSectionsToFirestore();
              anyRemoteFound = true;
            }
          } catch (_) {}
        }

        if (!anyRemoteFound) {
          await pushAllSectionsToFirestore();
        } else {
          writeLocalBackup(state);
          cloudStatus = "Synchronisé";
          renderApp();
        }

        // Écoute temps réel document par document
        for (const [sectionKey, refDoc] of Object.entries(docRefs)) {
          try {
            onSnapshot(refDoc, (docSnap) => {
              if (!docSnap.exists() || !docSnap.data()?.data) return;
              if (syncingFromFirebase.has(sectionKey) || savingToFirebase.has(sectionKey)) return;
              const remoteData = docSnap.data().data;
              const serialized = JSON.stringify(remoteData);
              if (serialized === lastSerializedBySection[sectionKey]) return;

              const activeTag = document.activeElement?.tagName;
              if (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT') {
                pendingRemoteBySection[sectionKey] = remoteData;
                return;
              }
              applyRemoteSectionData(sectionKey, remoteData);
            }, (err) => {
              console.warn(`Firestore snapshot warning (${sectionKey}):`, err);
            });
          } catch (_) {}
        }
      });

      signInAnonymously(auth).catch((err) => {
        console.warn("Anonymous auth warning:", err);
        cloudStatus = "Auth requise";
        renderApp();
      });
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeJsStr(str) {
      return String(str ?? '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, '\\n')
        .replace(/\r/g, '');
    }

    function downloadJson(filename, data) {
      try {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      } catch (_) {}
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        try {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error || new Error('FileReader error'));
          reader.readAsDataURL(blob);
        } catch (err) {
          reject(err);
        }
      });
    }

    function compressImageBlob(file, maxDim = 900, quality = 0.78) {
      return new Promise((resolve) => {
        try {
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              try {
                let { width, height } = img;
                if (width > maxDim || height > maxDim) {
                  if (width > height) {
                    height = Math.round((height * maxDim) / width);
                    width = maxDim;
                  } else {
                    width = Math.round((width * maxDim) / height);
                    height = maxDim;
                  }
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                canvas.toBlob((blob) => {
                  resolve(blob || file);
                }, 'image/jpeg', quality);
              } catch (_) {
                resolve(file);
              }
            };
            img.onerror = () => resolve(file);
            img.src = reader.result;
          };
          reader.onerror = () => resolve(file);
          reader.readAsDataURL(file);
        } catch (_) {
          resolve(file);
        }
      });
    }

    function normalizeAudioMime(file) {
      if (file.type && file.type.startsWith('audio/') && file.type !== 'audio/3gpp' && file.type !== 'audio/amr') {
        return file.type;
      }
      const ext = (file.name || '').split('.').pop().toLowerCase();
      const map = {
        mp3: 'audio/mpeg',
        m4a: 'audio/mp4',
        aac: 'audio/aac',
        wav: 'audio/wav',
        ogg: 'audio/ogg',
        opus: 'audio/opus',
        webm: 'audio/webm',
        '3gp': 'audio/mp4',
        amr: 'audio/mpeg'
      };
      return map[ext] || (file.type && file.type.startsWith('audio/') ? file.type : 'audio/mpeg');
    }

    function normalizeVideoMime(file) {
      if (file.type && file.type.startsWith('video/') && !/3gpp|x-matroska|x-msvideo/.test(file.type)) {
        return file.type;
      }
      const ext = (file.name || '').split('.').pop().toLowerCase();
      const map = {
        mp4: 'video/mp4',
        webm: 'video/webm',
        ogg: 'video/ogg',
        ogv: 'video/ogg',
        mov: 'video/mp4',
        m4v: 'video/mp4',
        '3gp': 'video/mp4',
        mkv: 'video/mp4',
        avi: 'video/mp4'
      };
      return map[ext] || (file.type && file.type.startsWith('video/') ? file.type : 'video/mp4');
    }

    function inferMimeFromUrl(url, kind) {
      if (!url || typeof url !== 'string') return kind === 'audio' ? 'audio/mpeg' : 'video/mp4';
      const matchData = url.match(/^data:([^;]+);base64,/i);
      if (matchData && matchData[1]) return matchData[1];
      const cleanUrl = url.split('?')[0].toLowerCase();
      if (cleanUrl.endsWith('.webm')) return kind === 'audio' ? 'audio/webm' : 'video/webm';
      if (cleanUrl.endsWith('.ogg') || cleanUrl.endsWith('.ogv') || cleanUrl.endsWith('.opus')) {
        return kind === 'audio' ? 'audio/ogg' : 'video/ogg';
      }
      if (cleanUrl.endsWith('.m4a') || cleanUrl.endsWith('.mp4') || cleanUrl.endsWith('.m4v') || cleanUrl.endsWith('.mov') || cleanUrl.endsWith('.3gp')) {
        return kind === 'audio' ? 'audio/mp4' : 'video/mp4';
      }
      if (cleanUrl.endsWith('.wav')) return 'audio/wav';
      return kind === 'audio' ? 'audio/mpeg' : 'video/mp4';
    }

    async function convertLargeMediaStream(file, contentType, ext) {
      const sizeMo = (file.size / (1024 * 1024)).toFixed(1);
      notify(`Préparation du flux (${sizeMo} Mo)...`);
      return {
        blob: file,
        contentType,
        ext
      };
    }

    function uploadResumableToStorage(storageRef, payloadBlob, contentType, labelName) {
      return new Promise((resolve, reject) => {
        const task = uploadBytesResumable(storageRef, payloadBlob, { contentType });
        let lastPct = -1;
        task.on(
          'state_changed',
          (snapshot) => {
            if (snapshot.totalBytes > 0) {
              const pct = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
              if (pct !== lastPct && (pct % 10 === 0 || pct === 100)) {
                lastPct = pct;
                const doneMo = (snapshot.bytesTransferred / (1024 * 1024)).toFixed(0);
                const totalMo = (snapshot.totalBytes / (1024 * 1024)).toFixed(0);
                notify(`Envoi ${labelName} : ${pct}% (${doneMo} / ${totalMo} Mo)`);
              }
            }
          },
          (err) => reject(err),
          async () => {
            try {
              const url = await getDownloadURL(task.snapshot.ref);
              resolve(url);
            } catch (e) {
              reject(e);
            }
          }
        );
      });
    }

    async function compressAndConvertMediaForFirebase(file, folderPath = 'gestion_media') {
      if (!file) return '';
      let payloadBlob = file;
      let contentType = file.type || 'application/octet-stream';
      let ext = (file.name && file.name.includes('.')) ? file.name.split('.').pop().toLowerCase() : 'bin';
      const isLargeMedia = file.size >= 25 * 1024 * 1024;

      try {
        if (file.type && file.type.startsWith('image/')) {
          payloadBlob = await compressImageBlob(file, 900, 0.78);
          contentType = 'image/jpeg';
          ext = 'jpg';
        } else if ((file.type && file.type.startsWith('audio/')) || /\.(mp3|m4a|aac|wav|ogg|opus|webm|3gp|amr)$/i.test(file.name || '')) {
          contentType = normalizeAudioMime(file);
          if (isLargeMedia) {
            const converted = await convertLargeMediaStream(file, contentType, ext);
            payloadBlob = converted.blob;
            contentType = converted.contentType;
            ext = converted.ext;
          } else {
            payloadBlob = new Blob([await file.arrayBuffer()], { type: contentType });
          }
        } else if ((file.type && file.type.startsWith('video/')) || /\.(mp4|webm|ogg|ogv|mov|m4v|3gp|mkv|avi)$/i.test(file.name || '')) {
          contentType = normalizeVideoMime(file);
          if (isLargeMedia) {
            const converted = await convertLargeMediaStream(file, contentType, ext);
            payloadBlob = converted.blob;
            contentType = converted.contentType;
            ext = converted.ext;
          } else {
            payloadBlob = new Blob([await file.arrayBuffer()], { type: contentType });
          }
        }
      } catch (_) {
        payloadBlob = file;
      }

      try {
        if (!storage || !auth) throw new Error('Storage unavailable');
        if (!firebaseUser) {
          await signInAnonymously(auth).catch(() => null);
        }
        const cleanBase = (file.name || 'fichier')
          .replace(/\.[^/.]+$/, '')
          .replace(/[^a-zA-Z0-9_-]/g, '_')
          .slice(0, 40);
        const storageRef = ref(storage, `comico/${folderPath}/${Date.now()}_${cleanBase}.${ext}`);
        if (isLargeMedia || payloadBlob.size >= 25 * 1024 * 1024) {
          return await uploadResumableToStorage(storageRef, payloadBlob, contentType, cleanBase);
        }
        const snap = await uploadBytes(storageRef, payloadBlob, { contentType });
        return await getDownloadURL(snap.ref);
      } catch (err) {
        console.warn('Storage upload fallback:', err);
        try {
          if (payloadBlob.size <= 850000) {
            return await blobToDataUrl(payloadBlob);
          }
          return URL.createObjectURL(payloadBlob);
        } catch (__) {
          return '';
        }
      }
    }

    function readFileAsDataUrl(input, callback, folderPath = 'gestion_media') {
      const file = input && input.files && input.files[0];
      if (!file) return;

      const isAuditFolder = folderPath === 'audit_audio' || folderPath === 'audit_video' || folderPath === 'audit_images';
      const maxInlineBytes = isAuditFolder ? 850000 : 320000;
      let uploadedRemoteUrl = '';

      if (file.size <= maxInlineBytes) {
        blobToDataUrl(file)
          .then((dataUrl) => {
            if (!uploadedRemoteUrl && dataUrl) {
              callback(dataUrl);
            }
          })
          .catch(() => {});
      } else {
        try {
          const previewUrl = URL.createObjectURL(file);
          if (previewUrl) callback(previewUrl);
        } catch (_) {}
      }

      compressAndConvertMediaForFirebase(file, folderPath)
        .then((finalUrl) => {
          if (finalUrl) {
            uploadedRemoteUrl = finalUrl;
            callback(finalUrl);
          }
        })
        .catch(() => {});
    }

        targetId = `AUD-${Math.floor(10000 + Math.random() * 90000)}`;
        state.auditForm.id = targetId;
        state.selectedAuditId = targetId;
        state.auditLogs.unshift({

          module: state.auditForm.module || 'Administration',
          action: state.auditForm.action || 'VERIFICATION_REGISTRE',
          details: (state.auditForm.details && state.auditForm.details.trim())
            ? state.auditForm.details.trim()
            : `Pièce jointe ${kind} enregistrée`,
          ip: '197.242.118.42',
          audio: kind === 'audio' ? url : '',
          video: kind === 'video' ? url : '',
          image: kind === 'image' ? url : ''
        });
      } else {
        const exists = state.auditLogs.some((a) => a.id === targetId);
        if (exists) {
          state.auditLogs = state.auditLogs.map((a) =>
            a.id === targetId ? { ...a, [kind]: url } : a
          );
        } else {
          const now = new Date();
          const ts = `${now.toISOString().split('T')[0]} ${now.toTimeString().split(' ')[0]} WAT`;
          state.auditLogs.unshift({
            id: targetId,

            province: state.auditForm.province || 'Kinshasa',
            module: state.auditForm.module || 'Administration',
            action: state.auditForm.action || 'VERIFICATION_REGISTRE',
            details: (state.auditForm.details && state.auditForm.details.trim())
              ? state.auditForm.details.trim()
              : `Pièce jointe ${kind} enregistrée`,
            ip: '197.242.118.42',

    function attachAuditMediaUrlToTarget(kind, url, targetAuditId = '') {
      if (!url) return;
      state.auditForm[kind] = url;
      const idToUpdate = targetAuditId || ensureAuditEntryForMedia(kind, url);
      state.auditLogs = state.auditLogs.map((a) =>
        a.id === idToUpdate ? { ...a, [kind]: url } : a
      );
      writeLocalBackup(state);
      writeAuditLocalCache(state.auditLogs, state.auditForm);
      renderApp();
      if (url.startsWith('http') || (url.startsWith('data:') && url.length <= 850000)) {
        pushSectionToFirestore('audit').catch(() => {});
      }
    }

    function handleAuditMediaUpload(input, kind, folderPath) {
      const file = input && input.files && input.files[0];
      if (!file) return;

      let typedBlob = file;
      if (kind === 'audio') {
        const mime = normalizeAudioMime(file);
        typedBlob = file.size >= 25 * 1024 * 1024 ? file : new Blob([file], { type: mime });
      } else if (kind === 'video') {
        const mime = normalizeVideoMime(file);
        typedBlob = file.size >= 25 * 1024 * 1024 ? file : new Blob([file], { type: mime });
      } else if (file.type && file.type.startsWith('image/')) {
        typedBlob = file;
      }

      const initialAuditId = ensureAuditEntryForMedia(kind, '');
      writeLocalBackup(state);
      writeAuditLocalCache(state.auditLogs, state.auditForm);

      let uploadedRemoteUrl = '';
      if (typedBlob.size <= 850000) {
        blobToDataUrl(typedBlob)
          .then((dataUrl) => {
            if (!uploadedRemoteUrl && dataUrl) {
              attachAuditMediaUrlToTarget(kind, dataUrl, initialAuditId);
            }
          })
          .catch(() => {});
      } else {
        try {
          const blobUrl = URL.createObjectURL(typedBlob);
          if (blobUrl) attachAuditMediaUrlToTarget(kind, blobUrl, initialAuditId);
        } catch (_) {}
      }

      const uploadPromise = compressAndConvertMediaForFirebase(file, folderPath)
        .then((finalUrl) => {
          if (finalUrl) {
            uploadedRemoteUrl = finalUrl;
            const boundId = pendingAuditMediaUploads[kind]?.boundAuditId || initialAuditId || state.auditForm.id || '';
            attachAuditMediaUrlToTarget(kind, finalUrl, boundId);
          }
          return finalUrl || '';
        })
        .catch(() => '')
        .finally(() => {
          if (pendingAuditMediaUploads[kind]?.promise === uploadPromise) {
            pendingAuditMediaUploads[kind] = null;
          }
        });

      pendingAuditMediaUploads[kind] = {
        promise: uploadPromise,
        boundAuditId: initialAuditId
      };
    }

    function buildQrSvg(text, size = 54) {
      const n = 15;
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      const cell = size / n;
      let rects = `<rect width="${size}" height="${size}" fill="#ffffff"/>`;

      const drawFinder = (gx, gy) => {
        rects += `<rect x="${gx * cell}" y="${gy * cell}" width="${5 * cell}" height="${5 * cell}" fill="#064e3b"/>`;
        rects += `<rect x="${(gx + 1) * cell}" y="${(gy + 1) * cell}" width="${3 * cell}" height="${3 * cell}" fill="#ffffff"/>`;
        rects += `<rect x="${(gx + 2) * cell}" y="${(gy + 2) * cell}" width="${1 * cell}" height="${1 * cell}" fill="#064e3b"/>`;
      };

      drawFinder(0, 0);
      drawFinder(n - 5, 0);
      drawFinder(0, n - 5);

      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          const inTopLeft = r < 5 && c < 5;
          const inTopRight = r < 5 && c >= n - 5;
          const inBottomLeft = r >= n - 5 && c < 5;
          if (inTopLeft || inTopRight || inBottomLeft) continue;
          const bit = ((hash >>> ((r * n + c) % 31)) ^ (r * 7 + c * 13 + text.length)) & 1;
          if (bit === 1) {
            rects += `<rect x="${c * cell}" y="${r * cell}" width="${cell}" height="${cell}" fill="#0f172a"/>`;
          }
        }
      }

      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="rounded border border-slate-300 bg-white shrink-0" aria-label="QR Code">${rects}</svg>`;
    }

    function renderMediaPreview(url, kind = 'image', label = 'Fichier') {
      if (!url) return '';
      if (kind === 'audio') {
        const mime = inferMimeFromUrl(url, 'audio');
        return `<audio controls preload="metadata" playsinline class="mt-2 w-full h-9" onerror="try{this.removeAttribute('type');this.load();}catch(_){}"><source src="${escapeHtml(url)}" type="${escapeHtml(mime)}" /><source src="${escapeHtml(url)}" /></audio>`;
      }
      if (kind === 'video') {
        const mime = inferMimeFromUrl(url, 'video');
        return `<video controls preload="metadata" playsinline class="mt-2 max-h-40 w-full rounded border bg-black" onerror="try{this.removeAttribute('type');this.load();}catch(_){}"><source src="${escapeHtml(url)}" type="${escapeHtml(mime)}" /><source src="${escapeHtml(url)}" /></video>`;
      }
      const isPdfOrDoc = typeof url === 'string' && (
        url.startsWith('data:application/pdf') ||
        url.startsWith('data:application/msword') ||
        url.startsWith('data:application/vnd.openxmlformats-officedocument') ||
        /\.pdf($|\?)|\.docx?($|\?)/i.test(url)
      );
      if (isPdfOrDoc) {
        return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" class="mt-2 inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded bg-emerald-50 text-emerald-900 border border-emerald-200 text-[11px] font-semibold">Ouvrir / Télécharger ${escapeHtml(label)}</a>`;
      }
      return `<img src="${escapeHtml(url)}" alt="${escapeHtml(label)}" class="mt-2 max-h-36 w-auto object-contain rounded border bg-white" />`;
    }

    function buildCertificateNote(cert) {
      if (cert.noteHierarchie && cert.noteHierarchie.trim()) {
        return cert.noteHierarchie.trim();
      }
      const signataire = cert.imamSignataire || 'la Hiérarchie Habilité du COMICO';
      const mosquee = cert.mosquee || 'la Mosquée désignée';
      const province = cert.province || 'RDC';
      const dateStr = cert.dateEmission || '';
      const benef = cert.beneficiaire || 'le/la bénéficiaire';

      if (cert.type === 'Acte de Mariage Religieux (Nikah)') {
        return `Note officielle de la Hiérarchie : Sous réserve des dispositions canoniques et réglementaires en vigueur au sein du COMICO • RDC, l’union religieuse (Nikah) de ${benef} célébrée à ${mosquee} (${province}) en date du ${dateStr} est certifiée conforme et soumise à la signature et au sceau de ${signataire}.`;
      }
      if (cert.type === 'Certificat de Conversion / Shahada') {
        return `Note officielle de la Hiérarchie : Il est attesté que ${benef} a prononcé librement et en pleine conscience la Shahada à ${mosquee} (${province}) le ${dateStr}. Document établi pour valoir ce que de droit, soumis à la signature de ${signataire}.`;
      }
      return `Note officielle de la Hiérarchie : La présente attestation d’Imamat concerne ${benef} au sein de ${mosquee} (${province}) à compter du ${dateStr}, établie pour signature et authentification par ${signataire}.`;
    }

    function renderMosquesCardsHtml() {
      const q = (state.mosqueSearch || '').trim().toLowerCase();

        ? state.mosques.filter((m) =>
            [m.id, m.nom, m.province, m.villeTerritoire, m.adressePhysique, m.imamPrincipal, m.statutFoncier]
              .some((val) => String(val || '').toLowerCase().includes(q))

        return `<div class="col-span-full bg-white rounded-xl border border-slate-200 p-6 text-center text-xs text-slate-500">Aucune mosquée trouvée pour la recherche.</div>`;

            <div class="w-full bg-slate-50 rounded-lg border border-slate-200 p-2 flex items-center justify-center">

              <span class="text-xs font-mono font-bold text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded">${escapeHtml(m.id)}</span>

            <p><strong>Province :</strong> ${escapeHtml(m.province)} • <strong>Ville / Territoire :</strong> ${escapeHtml(m.villeTerritoire)}</p>
            <p><strong>Adresse physique :</strong> ${escapeHtml(m.adressePhysique)} • <strong>Capacité d'accueil :</strong> ${Number(m.capaciteAccueil).toLocaleString()}</p>
            <p><strong>Salles d'ablution :</strong> ${escapeHtml(m.sallesAblution)} • <strong>Bibliothèque :</strong> ${escapeHtml(m.bibliotheque)} • <strong>Madrasa :</strong> ${escapeHtml(m.madrasa)} • <strong>Centre Médical :</strong> ${escapeHtml(m.centreMedical)}</p>

                <p class="text-slate-600 mt-1">Type : ${escapeHtml(w.type)} • Revenu mensuel : <strong>$${Number(w.revenuMensuelUSD).toLocaleString()} USD</strong> • Affectation : <strong>${escapeHtml(w.affectationRevenu)}</strong> • Statut : ${escapeHtml(w.statut)}</p>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderHajj() {
      const f = state.hajjForm;
      const selected = state.hajjPilgrims.find((h) => h.id === state.selectedHajjId) || state.hajjPilgrims[0] || null;
      const selId = selected ? selected.id : '';
      const selJsId = escapeJsStr(selId);
      return `
        <div class="space-y-6">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div>
              <h2 class="text-xl font-bold text-slate-900">Gestion Hajj & Omra RDC</h2>
              <p class="text-sm text-slate-500">Suivi des candidats pèlerins, forfaits, paiements et conformité sanitaire</p>
            </div>
            ${renderActionButtons({
              formId: 'hajj-form',
              onModify: `if('${selJsId}') editHajj('${selJsId}')`,
              onDelete: `if('${selJsId}') deleteHajj('${selJsId}')`,
              downloadName: 'hajj-omra-rdc-comico.json',
              downloadData: 'state.hajjPilgrims'
            })}
          </div>

          <form id="hajj-form" onsubmit="handleSaveHajj(event)" class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm grid grid-cols-1 md:grid-cols-5 gap-3 text-xs">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Nom du Candidat *</label>
              <input required type="text" value="${escapeHtml(f.nom)}" oninput="state.hajjForm.nom = this.value; writeLocalBackup(state);" class="w-full px-3 py-2 border rounded-lg" />
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">N° Passeport</label>
              <input type="text" value="${escapeHtml(f.passeport)}" oninput="state.hajjForm.passeport = this.value; writeLocalBackup(state);" class="w-full px-3 py-2 border rounded-lg" />
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Province & Forfait</label>
              <input type="text" value="${escapeHtml(f.forfait)}" oninput="state.hajjForm.forfait = this.value; writeLocalBackup(state);" class="w-full px-3 py-2 border rounded-lg" />
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Paiement (USD)</label>
              <input type="number" min="0" value="${escapeHtml(f.paiementUSD)}" oninput="state.hajjForm.paiementUSD = this.value; writeLocalBackup(state);" class="w-full px-3 py-2 border rounded-lg" />
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Image du Candidat</label>
              <input type="file" accept="image/*" onchange="readFileAsDataUrl(this, (res) => { state.hajjForm.photo = res; writeLocalBackup(state); renderApp(); }, 'hajj')" class="w-full px-2 py-1.5 border rounded-lg bg-slate-50" />
            </div>
          </form>

          ${f.photo ? `
            <div class="bg-white p-3 rounded-xl border border-slate-200 inline-block">
              <img src="${escapeHtml(f.photo)}" alt="Aperçu Candidat" class="h-28 w-28 object-cover rounded" />
            </div>
          ` : ''}

          <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm print-data-only space-y-2 text-xs">
            <h3 class="font-bold text-sm text-slate-900 mb-2">Dossiers Hajj & Omra RDC (${state.hajjPilgrims.length})</h3>
            ${state.hajjPilgrims.map(h => `
              <div onclick="state.selectedHajjId = '${escapeJsStr(h.id)}'; saveState(['hajj']); renderApp();" class="p-3.5 rounded-lg border cursor-pointer flex items-center gap-3 ${selId === h.id ? 'bg-emerald-50 border-emerald-600' : 'bg-slate-50 border-slate-200'}">
                ${h.photo
                  ? `<img src="${escapeHtml(h.photo)}" alt="${escapeHtml(h.nom)}" class="w-14 h-14 rounded-lg object-cover border border-slate-300 shrink-0" />`
                  : `<div class="w-14 h-14 rounded-lg bg-slate-200 text-slate-600 flex items-center justify-center text-[9px] font-bold shrink-0">PHOTO</div>`
                }
                <div>
                  <p class="font-bold text-slate-900">${escapeHtml(h.id)} — ${escapeHtml(h.nom)} (${escapeHtml(h.province)})</p>
                  <p class="text-slate-600 mt-1">Passeport : <span class="font-mono">${escapeHtml(h.passeport)}</span> • Forfait : ${escapeHtml(h.forfait)} • Paiement : <strong>$${Number(h.paiementUSD).toLocaleString()} USD (${escapeHtml(h.statutPaiement)})</strong> • Vaccin Méningite : ${h.vaccinMeningite ? 'À jour' : 'À vérifier'}</p>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderMain() {
      switch (state.activeTab) {
        case 'dashboard': return renderDashboard();
        case 'structure': return renderStructure();
        case 'mosques': return renderMosques();
        case 'members': return renderMembers();
        case 'leaders': return renderLeaders();
        case 'finance': return renderFinance();
        case 'events': return renderEvents();
        case 'certificates': return renderCertificates();
        case 'audit': return renderAudit();
        case 'admin': return renderAdmin();
        case 'waqf': return renderWaqf();
        case 'hajj': return renderHajj();
        default: return renderDashboard();
      }
    }

    function renderApp() {
      const appEl = document.getElementById('app');
      if (!appEl) return;

      try {
        const navSections = [
          {
            title: 'Pilotage & Vue Globale',
            items: [{ id: 'dashboard', label: 'Tableau de Bord' }]
          },
          {
            title: 'Gouvernance & Registres (09 Rubriques)',
            items: [
              { id: 'structure', label: '1. Structure et organes', badge: state.organs.length },
              { id: 'mosques', label: '2. Mosquées', badge: state.mosques.length },
              { id: 'members', label: '3. Membres', badge: state.members.length },
              { id: 'leaders', label: '4. Responsables religieux', badge: state.leaders.length },
              { id: 'finance', label: '5. Finance & Zakat', badge: state.transactions.length },
              { id: 'events', label: '6. Événements et fêtes', badge: state.events.length },
              { id: 'certificates', label: '7. Attestations religieuses', badge: state.certificates.length },
              { id: 'audit', label: "8. Journal d'audit", badge: state.auditLogs.length },
              { id: 'admin', label: '9. Administration' }
            ]
          },
          {
            title: 'Pôles Opérationnels Complémentaires',
            items: [
              { id: 'madrasas', label: 'Enseignement & Madrasas', href: 'edu_comico.html' },
              { id: 'waqf', label: 'Action Sociale & Waqf', badge: state.waqfs.length },
              { id: 'hajj', label: 'Gestion Hajj & Omra RDC', badge: state.hajjPilgrims.length }
            ]
          }
        ];

        appEl.innerHTML = `
          <div class="min-h-screen bg-slate-100 text-slate-900 flex flex-col lg:flex-row font-sans">
            ${state.notification ? `
              <div role="status" aria-live="polite" class="fixed bottom-5 right-5 z-50 bg-emerald-950 text-white px-4 py-3 rounded-xl shadow-2xl border border-amber-400/50 text-sm max-w-md no-print">
                ${escapeHtml(state.notification)}
              </div>
            ` : ''}

            ${state.mobileMenuOpen ? `
              <div onclick="toggleMobileMenu(false)" class="fixed inset-0 z-30 bg-slate-950/50 lg:hidden no-print"></div>
            ` : ''}

            <aside class="fixed inset-y-0 left-0 z-40 w-72 bg-emerald-950 text-emerald-50 flex flex-col transition-transform duration-200 lg:static lg:translate-x-0 ${state.mobileMenuOpen ? 'translate-x-0' : '-translate-x-full'}">
              <div class="p-5 border-b border-emerald-900 flex items-center justify-between">
                <div>
                  <h1 class="font-extrabold text-base tracking-tight text-white">COMICO • RDC</h1>
                  <p class="text-[11px] text-amber-300 font-medium">Administration Islamique</p>
                </div>
                <button type="button" onclick="toggleMobileMenu(false)" class="lg:hidden text-emerald-300 text-sm font-bold px-2 py-1 rounded hover:bg-emerald-900">✕</button>
              </div>
              <div class="flex-1 overflow-y-auto p-3 space-y-5">
                ${navSections.map((sec) => `
                  <div>
                    <p class="px-3 text-[10px] font-bold uppercase tracking-wider text-emerald-400/80 mb-1.5">${escapeHtml(sec.title)}</p>
                    <div class="space-y-1">
                      ${sec.items.map((item) => {
                        const active = state.activeTab === item.id;
                        const clickHandler = item.href
                          ? `window.location.href = '${escapeJsStr(item.href)}';`
                          : `openRubrique('${escapeJsStr(item.id)}');`;
                        return `
                          <button type="button" onclick="${clickHandler}" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold transition ${active ? 'bg-emerald-800 text-white border border-emerald-700' : 'text-emerald-100/80 hover:bg-emerald-900/60 hover:text-white'}">
                            <span class="truncate">${escapeHtml(item.label)}</span>
                            ${item.badge !== undefined ? `<span class="px-2 py-0.5 text-[10px] rounded-full bg-emerald-900 text-amber-300 font-bold">${escapeHtml(item.badge)}</span>` : ''}
                          </button>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            </aside>

            <div class="flex-1 flex flex-col min-w-0">
              <nav class="bg-white border-b border-slate-200 px-4 sm:px-6 py-2.5 no-print">
                <div class="flex flex-wrap items-center justify-between gap-3">
                  <a href="index.html" class="flex items-center gap-2.5 shrink-0">
                    <img src="img/logo1.jpg" alt="Logo COMICO-RDC" class="h-10 w-auto object-contain rounded" />
                    <span class="text-lg font-extrabold tracking-tight text-slate-900">
                      COMICO<span class="text-emerald-700">RDC</span>
                    </span>
                  </a>
                  <button type="button" onclick="toggleTopNav()" class="lg:hidden px-3 py-1.5 rounded-lg border border-slate-200 text-slate-700 text-xs font-semibold">
                    Menu
                  </button>
                  <div class="${state.topNavOpen ? 'flex' : 'hidden'} lg:flex flex-col lg:flex-row lg:items-center gap-1 lg:gap-4 w-full lg:w-auto text-xs font-semibold text-slate-700">
                    <a href="index.html" class="px-2.5 py-1.5 rounded-lg text-emerald-800 bg-emerald-50">Accueil</a>
                    <a href="about" class="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">À propos</a>
                    <a href="activities" class="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">Activités</a>
                    <a href="events" class="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">Événements</a>
                    <a href="sermons" class="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">Sermons</a>
                    <a href="gestion.html" class="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">Gestion</a>
                    <a href="edu_comico.html" class="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">Madrass</a>
                    <a href="#contact" class="px-3.5 py-2 rounded-lg bg-emerald-800 hover:bg-emerald-900 text-white text-xs font-semibold">Nous Contacter</a>
                  </div>
                </div>
              </nav>

              <header class="bg-white border-b border-slate-200 px-4 sm:px-6 py-3.5 flex items-center justify-between gap-4 sticky top-0 z-30">
                <div class="flex items-center gap-3">
                  <button type="button" onclick="toggleMobileMenu(true)" class="lg:hidden p-2 rounded-lg border border-slate-200 text-slate-700 text-xs font-bold">☰</button>
                  <span class="text-xs text-slate-500 font-medium">Système d’Information Unifié • Communauté Islamique en RDC</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold border ${cloudStatus === 'Synchronisé' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : cloudStatus === 'Erreur cloud' ? 'bg-rose-50 text-rose-800 border-rose-200' : 'bg-slate-100 text-slate-700 border-slate-200'}">
                    ${escapeHtml(cloudStatus)}
                  </span>
                  <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs font-semibold">
                    ${escapeHtml(getHeaderBadgeText())}
                  </span>
                </div>
              </header>

              <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
                ${renderMain()}
              </main>
            </div>
          </div>
        `;
        appEl.querySelectorAll('audio, video').forEach((mediaEl) => {
          try { mediaEl.load(); } catch (_) {}
        });
      } catch (err) {
        console.error("Render error:", err);
        appEl.innerHTML = `
          <div class="p-6 max-w-xl mx-auto mt-10 bg-white rounded-xl border border-rose-200 shadow space-y-3">
            <h2 class="text-base font-bold text-rose-800">Récupération de l'affichage</h2>
            <p class="text-xs text-slate-600">Un problème d'affichage a été intercepté. Vous pouvez réinitialiser la vue locale sans bloquer la page.</p>
            <button type="button" onclick="state = deepClone(INITIAL_STATE); renderApp();" class="px-4 py-2 bg-emerald-800 text-white rounded-lg text-xs font-semibold">
              Recharger le Tableau de Bord
            </button>
          </div>
        `;
      }
    }

    Object.defineProperty(window, 'state', {
      get: () => state,
      set: (val) => {
        state = val;
      },
      configurable: true
    });

    Object.assign(window, {
      INITIAL_STATE,
      deepClone,
      writeLocalBackup,
      writeAuditLocalCache,
      readAuditLocalCache,
      saveState,
      pushSectionToFirestore,
      pushAllSectionsToFirestore,
      openRubrique,
      notify,
      toggleMobileMenu,
      toggleTopNav,
      handleMosqueSearchInput,
      updateFinanceSplitPreview,
      addAudit,
      escapeHtml,
      escapeJsStr,
      downloadJson,
      compressImageBlob,
      normalizeVideoMime,
      convertLargeMediaStream,
      uploadResumableToStorage,
      compressAndConvertMediaForFirebase,
      readFileAsDataUrl,
      handleAuditMediaUpload,
      renderMediaPreview,
      getHeaderBadgeText,
      buildQrSvg,
      resetOrganForm,
      handleSaveOrgan,
      editOrgan,
      deleteOrgan,
      publishOrganigramme,
      handleMosqueImageUpload,
      resetMosqueForm,
      editMosque,
      handleSaveMosque,
      deleteMosque,
      handleMemberImageUpload,
      generateSystemCodeSecret,
      generateSystemIdNational,
      generateMemberIdCard,
      resetMemberForm,
      editMember,
      handleSaveMember,
      deleteMember,
      downloadMemberCardJson,
      generateSystemArreteNumber,
      signLeaderDecree,
      resetLeaderForm,
      editLeader,
      handleSaveLeader,
      deleteLeader,
      resetFinanceForm,
      handleSaveFinance,
      editFinance,
      deleteFinance,
      resetEventForm,
      handleSaveEvent,
      editEvent,
      deleteEvent,
      buildCertificateNote,
      resetCertificateForm,
      handleSaveCertificate,
      editCertificate,
      deleteCertificate,
      resetAuditForm,
      handleSaveAudit,
      editAudit,
      deleteAudit,
      resetWaqfForm,
      handleSaveWaqf,
      editWaqf,
      deleteWaqf,
      resetHajjForm,
      handleSaveHajj,
      editHajj,
      deleteHajj,
      renderActionButtons,
      renderApp
    });

    renderApp();
    initFirebaseSync();
  </script>
</body>
</html>
