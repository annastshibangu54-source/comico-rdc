  <script id="babel-cdn" src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    (function ensureCdnFallbacks() {
      function injectFallback(id, fallbackUrl) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('error', function () {
          if (el.dataset.fallbackApplied) return;
          el.dataset.fallbackApplied = '1';
          var s = document.createElement('script');
          s.src = fallbackUrl;
          s.crossOrigin = 'anonymous';
          document.head.appendChild(s);
        });
      }
      injectFallback('react-cdn', 'https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js');
      injectFallback('reactdom-cdn', 'https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js');
      injectFallback('babel-cdn', 'https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js');
    })();
  </script>

    @media print {
      aside, header, .no-print { display: none !important; }

              'class="px-4 py-2 rounded-lg bg-emerald-800 text-white text-xs font-semibold">' +

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { error: null };
      }
      static getDerivedStateFromError(error) {
        return { error };
      }
      render() {
        if (this.state.error) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-slate-100">
              <div className="max-w-lg w-full bg-white border border-rose-200 rounded-2xl p-6 shadow space-y-3">
                <h2 className="text-base font-bold text-rose-800">Erreur d’affichage React</h2>
                <pre className="text-xs bg-slate-900 text-rose-200 p-3 rounded-lg overflow-x-auto">
                  {String(this.state.error && this.state.error.message ? this.state.error.message : this.state.error)}
                </pre>
                <button
                  type="button"
                  onClick={() => {
                    localStorage.removeItem('comico_rdc_pro_state_v1');
                    window.location.reload();
                  }}
                  className="px-4 py-2 rounded-lg bg-emerald-800 text-white text-xs font-semibold"
                >
                  Réinitialiser les données et recharger
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }

    function DeterministicQRCode({ value, size = 84 }) {
      const cells = useMemo(() => {
        const grid = [];
        let hash = 0;
        const str = String(value || 'COMICO-RDC');
        for (let i = 0; i < str.length; i++) {
          hash = (hash << 5) - hash + str.charCodeAt(i);
          hash |= 0;
        }
        for (let r = 0; r < 9; r++) {
          const row = [];
          for (let c = 0; c < 9; c++) {
            const isFinder = (r < 3 && c < 3) || (r < 3 && c > 5) || (r > 5 && c < 3);
            if (isFinder) {
              row.push(true);
            } else {
              const bit = Math.abs((hash * (r + 3) * (c + 7) + r * 13 + c * 17) % 5);
              row.push(bit < 2);
            }
          }
          grid.push(row);
        }
        return grid;
      }, [value]);

      return (
        <div
          className="inline-flex flex-col items-center justify-center bg-white p-1.5 rounded border border-emerald-900/20 shadow-sm"
          title={`Code de vérification : ${value}`}
        >
          <svg width={size} height={size} viewBox="0 0 9 9" className="block">
            {cells.map((row, rIdx) =>
              row.map((active, cIdx) =>
                active ? (
                  <rect
                    key={`${rIdx}-${cIdx}`}
                    x={cIdx}
                    y={rIdx}
                    width={0.92}
                    height={0.92}
                    fill="#064e3b"
                  />
                ) : null
              )
            )}
          </svg>
        </div>
      );
    }

    function StructureView({

      const [expandedIds, setExpandedIds] = useState(['ORG-NAT-01', 'ORG-PROV-KIN', 'ORG-PROV-NK']);
      const [selectedOrgan, setSelectedOrgan] = useState(organs[0] || null);

        parentId: 'ORG-NAT-01',

        niveau: 'Provincial',
        province: 'Kinshasa',
        siege: '',
        president: '',
        mandat: '2025 - 2030',
        effectifBureau: 9
      });

      const flattenOrgans = (nodes, list = []) => {
        nodes.forEach((n) => {
          list.push(n);
          if (n.enfants && n.enfants.length > 0) flattenOrgans(n.enfants, list);
        });
        return list;
      };

      const allFlatOrgans = useMemo(() => flattenOrgans(organs), [organs]);

      useEffect(() => {
        if (selectedOrgan) {
          const updated = allFlatOrgans.find((o) => o.id === selectedOrgan.id);
          setSelectedOrgan(updated || allFlatOrgans[0] || null);
        } else if (allFlatOrgans[0]) {
          setSelectedOrgan(allFlatOrgans[0]);

      }, [allFlatOrgans]);

      const toggleExpand = (id) => {
        setExpandedIds((prev) =>
          prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]

      };

      const resetForm = () => {
        setEditingId(null);

    function MosquesView({ mosques, onAddMosque, onDeleteMosque, onNotify }) {
      const [search, setSearch] = useState('');
      const [provinceFilter, setProvinceFilter] = useState('Toutes');
      const [showModal, setShowModal] = useState(false);
      const [newMosque, setNewMosque] = useState({
        nom: '',
        province: 'Kinshasa',
        ville: '',
        adresse: '',
        capacite: 500,
        statutFoncier: 'Titre Foncier Enregistré',
        sallesAblution: true,
        bibliotheque: false,
        madrassa: true,
        centreMedical: false,
        imamPrincipal: '',
        image: ''
      });

      const filteredMosques = mosques.filter((m) => {
        const matchSearch =
          m.nom.toLowerCase().includes(search.toLowerCase()) ||
          m.ville.toLowerCase().includes(search.toLowerCase()) ||
          m.imamPrincipal.toLowerCase().includes(search.toLowerCase());
        const matchProvince = provinceFilter === 'Toutes' || m.province === provinceFilter;
        return matchSearch && matchProvince;
      });

      const handleImageFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          setNewMosque((prev) => ({ ...prev, image: String(reader.result || '') }));
        };
        reader.readAsDataURL(file);
      };

      const resetMosqueForm = () => {
        setNewMosque({
          nom: '',
          province: 'Kinshasa',
          ville: '',
          adresse: '',
          capacite: 500,
          statutFoncier: 'Titre Foncier Enregistré',
          sallesAblution: true,
          bibliotheque: false,
          madrassa: true,
          centreMedical: false,
          imamPrincipal: '',
          image: ''
        });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!newMosque.nom.trim() || !newMosque.ville.trim()) return;
        const annexesList = [];
        if (newMosque.sallesAblution) annexesList.push('Salles d’ablution');
        if (newMosque.bibliotheque) annexesList.push('Bibliothèque');
        if (newMosque.madrassa) annexesList.push('Madrassa');
        if (newMosque.centreMedical) annexesList.push('Centre Médical');
        onAddMosque({ ...newMosque, annexes: annexesList });
        setShowModal(false);
        resetMosqueForm();
      };

          <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse text-sm">
                <thead>
                  <tr className="bg-slate-50 border-b border-slate-200 text-xs font-bold uppercase text-slate-500">
                    <th className="py-3 px-4">Dossier</th>
                    <th className="py-3 px-4">Candidat Pèlerin</th>

                      <td className="py-3 px-4 font-mono text-xs text-slate-600">{p.passeport}</td>

                      <td className="py-3 px-4">
                        <span className="text-xs font-bold text-emerald-800">${Number(p.paiementUSD || 0).toLocaleString()}</span>
                        <span className="block text-[11px] text-slate-500">{p.statutPaiement}</span>
                      </td>
                      <td className="py-3 px-4">
                        <span className={`px-2 py-0.5 text-xs font-semibold rounded-full ${p.vaccinMeningite ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                          {p.vaccinMeningite ? 'Conforme' : 'En attente'}
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>

          </div>
        </div>
      );
    }

    function loadSavedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return null;
        return {
          ...parsed,
          organs: Array.isArray(parsed.organs) && parsed.organs.length ? parsed.organs : null,
          mosques: Array.isArray(parsed.mosques) && parsed.mosques.length ? parsed.mosques : null,
          members: Array.isArray(parsed.members) && parsed.members.length ? parsed.members : null,
          leaders: Array.isArray(parsed.leaders) && parsed.leaders.length ? parsed.leaders : null,
          transactions: Array.isArray(parsed.transactions) && parsed.transactions.length ? parsed.transactions : null,
          events: Array.isArray(parsed.events) && parsed.events.length ? parsed.events : null,
          certificates: Array.isArray(parsed.certificates) && parsed.certificates.length ? parsed.certificates : null,
          auditLogs: Array.isArray(parsed.auditLogs) && parsed.auditLogs.length ? parsed.auditLogs : null,
          hajjPilgrims: Array.isArray(parsed.hajjPilgrims) && parsed.hajjPilgrims.length ? parsed.hajjPilgrims : null
        };
      } catch {
        return null;
      }
    }

    function App() {
      const saved = useMemo(() => loadSavedState(), []);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [activeLevelFilter, setActiveLevelFilter] = useState('National (Toutes provinces)');
      const [notification, setNotification] = useState(null);
      const [topNavOpen, setTopNavOpen] = useState(false);
      const [pagesDropdownOpen, setPagesDropdownOpen] = useState(false);
      const [isAdminRegistrar, setIsAdminRegistrar] = useState(
        saved?.isAdminRegistrar !== undefined ? saved.isAdminRegistrar : true
      );

      const [organs, setOrgans] = useState(saved?.organs || INITIAL_ORGANS);
      const [mosques, setMosques] = useState(saved?.mosques || INITIAL_MOSQUES);
      const [members, setMembers] = useState(saved?.members || INITIAL_MEMBERS);
      const [leaders, setLeaders] = useState(saved?.leaders || INITIAL_LEADERS);
      const [transactions, setTransactions] = useState(saved?.transactions || INITIAL_TRANSACTIONS);
      const [events, setEvents] = useState(saved?.events || INITIAL_EVENTS);
      const [certificates, setCertificates] = useState(saved?.certificates || INITIAL_CERTIFICATES);
      const [auditLogs, setAuditLogs] = useState(saved?.auditLogs || INITIAL_AUDIT_LOGS);
      const [madrasas] = useState(INITIAL_MADRASAS);
      const [waqfs] = useState(INITIAL_WAQF);
      const [hajjPilgrims, setHajjPilgrims] = useState(saved?.hajjPilgrims || INITIAL_HAJJ);
      const [splitRules, setSplitRules] = useState(
        saved?.splitRules || { locale: 50, provinciale: 30, nationale: 20 }
      );

      useEffect(() => {
        const rootEl = document.getElementById('root');
        if (rootEl) rootEl.dataset.appMounted = '1';
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              isAdminRegistrar,
              organs,
              mosques,
              members,
              leaders,
              transactions,
              events,
              certificates,
              auditLogs,
              hajjPilgrims,
              splitRules
            })
          );
        } catch {
          // Ignorer si le stockage local est indisponible
        }
      }, [
        isAdminRegistrar,
        organs,
        mosques,
        members,
        leaders,
        transactions,
        events,
        certificates,
        auditLogs,
        hajjPilgrims,
        splitRules
      ]);

      const pushNotification = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 4200);
      };

      const appendAudit = (prevLogs, module, action, details, province = 'Kinshasa') => {
        const now = new Date();
        const formattedDate = `${now.toISOString().split('T')[0]} ${now.toTimeString().split(' ')[0]} WAT`;
        return [
          {
            id: `AUD-${Math.floor(10000 + Math.random() * 90000)}`,
            timestamp: formattedDate,
            acteur: 'Chargé de l’Administration',
            role: 'Super Admin National',
            province,
            module,
            action,
            details,
            ip: '197.242.118.42'
          },
          ...prevLogs
        ];
      };

      const recordAudit = (module, action, details, province = 'Kinshasa') => {
        setAuditLogs((prev) => appendAudit(prev, module, action, details, province));
      };

      const financialStats = useMemo(() => {
        let totalEntrees = 0;
        let totalSorties = 0;
        let caisseLocale = 0;
        let caisseProvinciale = 0;
        let caisseNationale = 0;

        transactions.forEach((t) => {
          if (t.type === 'Entrée') {
            totalEntrees += t.montantUSD;
            caisseLocale += t.partLocale;
            caisseProvinciale += t.partProvinciale;
            caisseNationale += t.partNationale;
          } else {
            totalSorties += t.montantUSD;
            caisseNationale += t.partNationale;
          }
        });

        return {
          totalEntrees,
          totalSorties,
          soldeGlobal: totalEntrees - totalSorties,
          caisseLocale,
          caisseProvinciale,
          caisseNationale
        };
      }, [transactions]);

      const insertUnderParent = (nodes, parentId, newNode) =>
        nodes.map((node) => {
          if (node.id === parentId) {
            return { ...node, enfants: [...(node.enfants || []), newNode] };
          }
          if (node.enfants && node.enfants.length > 0) {
            return { ...node, enfants: insertUnderParent(node.enfants, parentId, newNode) };
          }
          return node;
        });

      const updateInTree = (nodes, targetId, patch) =>
        nodes.map((node) => {
          if (node.id === targetId) {
            return { ...node, ...patch };
          }
          if (node.enfants && node.enfants.length > 0) {
            return { ...node, enfants: updateInTree(node.enfants, targetId, patch) };
          }
          return node;
        });

      const removeFromTree = (nodes, targetId) =>
        nodes
          .filter((node) => node.id !== targetId)
          .map((node) => ({
            ...node,
            enfants: node.enfants ? removeFromTree(node.enfants, targetId) : []
          }));

      const handleSaveOrgan = (input) => {
        const created = {
          id: `ORG-${Date.now()}`,
          code: input.code?.trim() || `COMICO-${input.province.slice(0, 3).toUpperCase()}-${Math.floor(10 + Math.random() * 89)}`,
          nom: input.nom.trim(),
          niveau: input.niveau,
          province: input.province,
          siege: input.siege?.trim() || 'À préciser',
          president: input.president.trim(),
          mandat: input.mandat || '2025 - 2030',
          statut: 'Actif',
          effectifBureau: Number(input.effectifBureau) || 7,
          enfants: []
        };
        setOrgans((prev) => insertUnderParent(prev, input.parentId, created));
        recordAudit('Structure et organes', 'ENREGISTREMENT_AUTORITE_HIE', `Ajout ${created.code} — ${created.nom} (${created.president})`, created.province);
        pushNotification(`Entité & autorité "${created.nom}" enregistrée dans l’organigramme HIE.`);
      };

      const handleUpdateOrgan = (targetId, input) => {
        setOrgans((prev) =>
          updateInTree(prev, targetId, {
            code: input.code?.trim() || undefined,
            nom: input.nom.trim(),
            niveau: input.niveau,
            province: input.province,
            siege: input.siege?.trim() || 'À préciser',
            president: input.president.trim(),
            mandat: input.mandat || '2025 - 2030',
            effectifBureau: Number(input.effectifBureau) || 7
          })
        );
        recordAudit('Structure et organes', 'MODIFICATION_AUTORITE_HIE', `Mise à jour ${input.nom} (${input.president})`, input.province);
        pushNotification(`Autorité / entité "${input.nom}" mise à jour.`);
      };

      const handleDeleteOrgan = (targetId) => {
        setOrgans((prev) => removeFromTree(prev, targetId));
        recordAudit('Structure et organes', 'SUPPRESSION_AUTORITE_HIE', `Suppression organe ID ${targetId}`);
        pushNotification('Entité supprimée de l’organigramme HIE.');
      };

      const handlePublishOrgans = () => {
        recordAudit('Structure et organes', 'PUBLICATION_ORGANIGRAMME_HIE', 'Publication officielle de l’organigramme HIE');
        pushNotification('Organigramme HIE publié avec succès.');
      };

      const handleAddMosque = (input) => {
        const created = {
          id: `MSQ-${input.province.slice(0, 3).toUpperCase()}-${Math.floor(100 + Math.random() * 899)}`,
          ...input,
          capacite: Number(input.capacite) || 0,
          gps: '-4.3210, 15.3120',
          annexes: input.annexes?.length ? input.annexes : ['Salles d’ablution', 'Madrassa'],
          etat: 'Bon',
          dateConstruction: '2026'
        };
        setMosques((prev) => [created, ...prev]);
        recordAudit('Mosquées', 'ENREGISTREMENT_MOSQUEE', `Ajout de ${created.nom} (${created.province})`, created.province);
        pushNotification(`La mosquée "${created.nom}" a été enregistrée au patrimoine.`);
      };

      const handleDeleteMosque = (id) => {
        setMosques((prev) => prev.filter((m) => m.id !== id));
        recordAudit('Mosquées', 'SUPPRESSION_MOSQUEE', `Suppression mosquée ${id}`);
        pushNotification('Mosquée retirée du registre.');
      };

      const handleCreateMember = (input) => {
        const idNat =
          input.idNational?.trim() ||
          `RDC-COM-2026-${String(Math.floor(100000 + Math.random() * 899999))}`;
        const created = {
          id: idNat,
          ...input,
          dateNaissance: '1990-01-01',
          mosqueeId: 'MSQ-KIN-001',
          foyer: 'Non renseigné',
          statut: 'Actif',
          dateAdhesion: new Date().toISOString().split('T')[0]
        };
        setMembers((prev) => [created, ...prev]);
        recordAudit('Membres', 'ENROLEMENT_FIDELE', `Enrôlement national de ${created.prenom} ${created.nom} (${created.id})`, created.province);
        pushNotification(`Membre ${created.prenom} ${created.nom} enregistré (${created.id}).`);
        return created;
      };

      const handleDeleteMember = (id) => {
        setMembers((prev) => prev.filter((m) => m.id !== id));
        recordAudit('Membres', 'SUPPRESSION_FIDELE', `Suppression membre ${id}`);
        pushNotification('Membre supprimé du registre.');
      };

      const handleAddLeader = (input) => {
        const created = {
          id: `IMAM-RDC-${Math.floor(100 + Math.random() * 899)}`,
          ...input,
          acteNomination: `ARR-NAT/${Math.floor(100 + Math.random() * 899)}/2026`,
          dateNomination: new Date().toISOString().split('T')[0],
          evaluation: '90%',
          statut: 'En fonction'
        };
        setLeaders((prev) => [created, ...prev]);
        recordAudit('Responsables religieux', 'NOMINATION_IMAM', `Acte ${created.acteNomination} : ${created.nom} affecté à ${created.affectation}`, created.province);
        pushNotification(`Arrêté ${created.acteNomination} signé et enregistré pour ${created.nom}.`);
      };

      const handleDeleteLeader = (id) => {
        setLeaders((prev) => prev.filter((l) => l.id !== id));
        recordAudit('Responsables religieux', 'SUPPRESSION_IMAM', `Suppression responsable ${id}`);
        pushNotification('Responsable religieux supprimé.');
      };

      const handleRecordTransaction = (input) => {
        const amount = Number(input.montantUSD);
        const isIncome = input.type === 'Entrée';
        const partLocale = isIncome ? Math.round((amount * splitRules.locale) / 100) : 0;
        const partProvinciale = isIncome ? Math.round((amount * splitRules.provinciale) / 100) : 0;
        const partNationale = isIncome ? amount - partLocale - partProvinciale : -amount;

        const created = {
          id: `TRX-2026-${Math.floor(1000 + Math.random() * 8999)}`,
          date: new Date().toISOString().split('T')[0],
          ...input,
          reference: input.reference || `MM-${Math.floor(100000 + Math.random() * 899999)}`,
          montantUSD: amount,
          partLocale,
          partProvinciale,
          partNationale,
          statut: 'Validé'
        };
        setTransactions((prev) => [created, ...prev]);
        recordAudit(
          'Finance & Zakat',
          isIncome ? 'ENCAISSEMENT_ZAKAT_COTISATION' : 'DECAISSEMENT_SOCIAL',
          `${created.id} (${created.categorie}) : $${amount} USD via ${created.mode}`
        );
        pushNotification(`Écriture comptable ${created.id} validée et ventilée automatiquement.`);
      };

      const handleAddEvent = (input) => {
        const created = {
          id: `EVT-${Math.floor(100 + Math.random() * 899)}`,
          ...input,
          statut: 'Planifié'
        };
        setEvents((prev) => [created, ...prev]);
        recordAudit('Événements et fêtes', 'PLANIFICATION_EVENEMENT', `Ajout au calendrier officiel : ${created.titre}`, created.province);
        pushNotification(`Événement "${created.titre}" publié au calendrier national.`);
      };

      const handleGenerateCertificate = (input) => {
        const created = {
          id: `ACT-RDC-2026-0${Math.floor(422 + Math.random() * 500)}`,
          ...input,
          dateEmission: new Date().toISOString().split('T')[0],
          hashVerification: `COMICO-SHA256-${Math.random().toString(36).substring(2, 10).toUpperCase()}`,
          statut: 'Authentifié'
        };
        setCertificates((prev) => [created, ...prev]);
        recordAudit('Attestations religieuses', 'EMISSION_ACTE_OFFICIEL', `Délivrance ${created.id} (${created.type}) à ${created.beneficiaire}`, created.province);
        pushNotification(`Acte officiel ${created.id} généré avec signature numérique et QR Code.`);
        return created;
      };

      const handleUpdateSplit = (nextSplit) => {
        if (nextSplit.locale + nextSplit.provinciale + nextSplit.nationale !== 100) {
          pushNotification('Erreur : La somme des quotes-parts doit être exactement égale à 100%.');
          return;
        }
        setSplitRules(nextSplit);
        recordAudit(
          'Administration',
          'MODIFICATION_CLE_FINANCIERE',
          `Nouvelle répartition : ${nextSplit.locale}% / ${nextSplit.provinciale}% / ${nextSplit.nationale}%`
        );
        pushNotification('Paramètres statutaires de répartition financière mis à jour.');
      };

      const handleRegisterPilgrim = (nom, province) => {
        const created = {
          id: `HAJ-2027-00${hajjPilgrims.length + 1}`,
          nom,
          passeport: `OP${Math.floor(1000000 + Math.random() * 8999999)}`,
          province,
          forfait: 'Forfait Standard RDC',
          paiementUSD: 2500,
          statutPaiement: 'Acompte (50%)',
          vaccinMeningite: true
        };
        setHajjPilgrims((prev) => [created, ...prev]);
        recordAudit('Hajj & Omra RDC', 'INSCRIPTION_PELERIN', `Inscription Hajj 1448 AH : ${created.nom} (${created.province})`, created.province);
        pushNotification(`Pèlerin ${created.nom} enregistré sur le quota RDC 1448 AH.`);
      };

      const handleResetData = () => {
        localStorage.removeItem(STORAGE_KEY);
        setIsAdminRegistrar(true);
        setOrgans(INITIAL_ORGANS);
        setMosques(INITIAL_MOSQUES);
        setMembers(INITIAL_MEMBERS);
        setLeaders(INITIAL_LEADERS);
        setTransactions(INITIAL_TRANSACTIONS);
        setEvents(INITIAL_EVENTS);
        setCertificates(INITIAL_CERTIFICATES);
        setAuditLogs(INITIAL_AUDIT_LOGS);
        setHajjPilgrims(INITIAL_HAJJ);
        setSplitRules({ locale: 50, provinciale: 30, nationale: 20 });
        pushNotification('Données locales réinitialisées aux valeurs de référence.');
      };

      const navigationSections = [
        {
          title: 'Pilotage & Vue Globale',
          items: [
            { id: 'dashboard', label: 'Tableau de Bord', icon: LayoutDashboard }
          ]
        },
        {
          title: 'Gouvernance & Registres (09 Rubriques)',
          items: [
            { id: 'structure', label: '1. Structure et organes', icon: Network },
            { id: 'mosques', label: '2. Mosquées', icon: Building2, badge: mosques.length },
            { id: 'members', label: '3. Membres', icon: Users, badge: members.length },
            { id: 'leaders', label: '4. Responsables religieux', icon: Award, badge: leaders.length },
            { id: 'finance', label: '5. Finance & Zakat', icon: Wallet },
            { id: 'events', label: '6. Événements et fêtes', icon: Calendar },
            { id: 'certificates', label: '7. Attestations religieuses', icon: FileCheck2, badge: certificates.length },
            { id: 'audit', label: "8. Journal d'audit", icon: ShieldAlert, badge: auditLogs.length },
            { id: 'admin', label: '9. Administration', icon: Settings }
          ]
        },
        {
          title: 'Pôles Opérationnels Complémentaires',
          items: [
            { id: 'madrasas', label: 'Enseignement & Madrasas', icon: BookOpen },
            { id: 'waqf', label: 'Action Sociale & Waqf', icon: HeartHandshake },
            { id: 'hajj', label: 'Gestion Hajj & Omra RDC', icon: Plane }
          ]
        }
      ];

      return (
        <div className="min-h-screen bg-slate-100 text-slate-900 flex flex-col lg:flex-row font-sans">
          {notification && (
            <div className="fixed bottom-5 right-5 z-50 bg-emerald-950 text-white px-4 py-3 rounded-xl shadow-2xl border border-amber-400/50 flex items-center gap-3 text-sm max-w-md no-print">
              <CheckCircle2 className="w-5 h-5 text-amber-400 shrink-0" />
              <span>{notification}</span>
            </div>
          )}

          <aside
            className={`fixed inset-y-0 left-0 z-40 w-72 bg-emerald-950 text-emerald-50 flex flex-col transition-transform duration-200 lg:static lg:translate-x-0 ${
              mobileMenuOpen ? 'translate-x-0' : '-translate-x-full'
            }`}
          >
            <div className="p-5 border-b border-emerald-900 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center text-emerald-950 font-extrabold shadow">
                  <Landmark className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="font-extrabold text-base tracking-tight text-white">COMICO • RDC</h1>
                  <p className="text-[11px] text-amber-300 font-medium">Administration Islamique</p>
                </div>
              </div>
              <button type="button" onClick={() => setMobileMenuOpen(false)} className="lg:hidden text-emerald-300">
                <X className="w-5 h-5" />
              </button>
            </div>

            <div className="flex-1 overflow-y-auto p-3 space-y-5">
              {navigationSections.map((section) => (
                <div key={section.title}>
                  <p className="px-3 text-[10px] font-bold uppercase tracking-wider text-emerald-400/80 mb-1.5">
                    {section.title}
                  </p>
                  <div className="space-y-1">
                    {section.items.map((item) => {
                      const Icon = item.icon;
                      const active = activeTab === item.id;
                      return (
                        <button
                          type="button"
                          key={item.id}
                          onClick={() => {
                            setActiveTab(item.id);
                            setMobileMenuOpen(false);
                          }}
                          className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold transition ${
                            active
                              ? 'bg-emerald-800 text-white shadow-sm border border-emerald-700'
                              : 'text-emerald-100/80 hover:bg-emerald-900/60 hover:text-white'
                          }`}
                        >
                          <span className="flex items-center gap-2.5 truncate">
                            <Icon className={`w-4 h-4 shrink-0 ${active ? 'text-amber-400' : 'text-emerald-400'}`} />
                            <span className="truncate">{item.label}</span>
                          </span>
                          {item.badge !== undefined && (
                            <span className="px-2 py-0.5 text-[10px] rounded-full bg-emerald-900 text-amber-300 font-bold">
                              {item.badge}
                            </span>
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>

            <div className="p-4 border-t border-emerald-900 bg-emerald-950/80 text-xs">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-full bg-emerald-800 flex items-center justify-center font-bold text-amber-300 border border-amber-400/30">
                  CA
                </div>
                <div className="truncate">
                  <p className="font-bold text-white truncate">Chargé de l’Administration</p>
                  <p className="text-[11px] text-emerald-400 truncate">Siège National • Kinshasa</p>
                </div>
              </div>
            </div>
          </aside>

          <div className="flex-1 flex flex-col min-w-0">
            <nav className="bg-white border-b border-slate-200 px-4 sm:px-6 py-2.5 no-print">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <a href="index.html" className="flex items-center gap-2.5 shrink-0">
                  <img
                    src="img/logo1.jpg"
                    alt="Logo COMICO-RDC"
                    onError={(e) => { e.currentTarget.style.display = 'none'; }}
                    className="h-10 w-auto object-contain rounded"
                  />
                  <span className="text-lg font-extrabold tracking-tight text-slate-900">
                    COMICO<span className="text-emerald-700">RDC</span>
                  </span>
                </a>

                <button
                  type="button"
                  onClick={() => setTopNavOpen((prev) => !prev)}
                  className="lg:hidden px-3 py-1.5 rounded-lg border border-slate-200 text-slate-700 text-xs font-semibold flex items-center gap-1.5"
                >
                  <Menu className="w-4 h-4" />
                  <span>Menu</span>
                </button>

                <div
                  className={`${
                    topNavOpen ? 'flex' : 'hidden'
                  } lg:flex flex-col lg:flex-row lg:items-center gap-1 lg:gap-4 w-full lg:w-auto text-xs font-semibold text-slate-700`}
                >
                  <a href="index.html" className="px-2.5 py-1.5 rounded-lg text-emerald-800 bg-emerald-50">
                    Accueil
                  </a>
                  <a href="about" className="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">
                    À propos
                  </a>
                  <a href="activities" className="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">
                    Activités
                  </a>
                  <a href="events" className="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">
                    Événements
                  </a>
                  <a href="sermons" className="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">
                    Sermons
                  </a>
                  <a href="gestion.html" className="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">
                    Gestion
                  </a>
                  <a href="edu_comico.html" className="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">
                    Madrass
                  </a>

                  <div className="relative">
                    <button
                      type="button"
                      onClick={() => setPagesDropdownOpen((prev) => !prev)}
                      className="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50 inline-flex items-center gap-1"
                    >
                      <span>Pages</span>
                      <ChevronDown className="w-3.5 h-3.5" />
                    </button>
                    {pagesDropdownOpen && (
                      <div className="lg:absolute right-0 mt-1 w-44 bg-white border border-slate-200 rounded-xl shadow-lg py-1 z-40">
                        <a
                          href="#blog"
                          onClick={() => setPagesDropdownOpen(false)}
                          className="block px-3 py-2 text-xs text-slate-700 hover:bg-emerald-50 hover:text-emerald-900"
                        >
                          Dernier Blog
                        </a>
                        <a
                          href="#team"
                          onClick={() => setPagesDropdownOpen(false)}
                          className="block px-3 py-2 text-xs text-slate-700 hover:bg-emerald-50 hover:text-emerald-900"
                        >
                          Notre Équipe
                        </a>
                        <a
                          href="#testimonial"
                          onClick={() => setPagesDropdownOpen(false)}
                          className="block px-3 py-2 text-xs text-slate-700 hover:bg-emerald-50 hover:text-emerald-900"
                        >
                          Témoignages
                        </a>
                        <a
                          href="404.html"
                          onClick={() => setPagesDropdownOpen(false)}
                          className="block px-3 py-2 text-xs text-slate-700 hover:bg-emerald-50 hover:text-emerald-900"
                        >
                          Page 404
                        </a>
                      </div>
                    )}
                  </div>

                  <a href="#contact" className="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">
                    Contact
                  </a>
                  <a
                    href="#contact"
                    className="hidden xl:inline-block px-3.5 py-2 rounded-lg bg-emerald-800 hover:bg-emerald-900 text-white text-xs font-semibold transition"
                  >
                    Nous Contacter
                  </a>
                </div>
              </div>
            </nav>

            <header className="bg-white border-b border-slate-200 px-4 sm:px-6 py-3.5 flex items-center justify-between gap-4 sticky top-0 z-30">
              <div className="flex items-center gap-3">
                <button
                  type="button"
                  onClick={() => setMobileMenuOpen(true)}
                  className="lg:hidden p-2 rounded-lg border border-slate-200 text-slate-700"
                >
                  <Menu className="w-5 h-5" />
                </button>
                <span className="text-xs text-slate-400 font-medium hidden sm:inline">
                  Système d’Information Unifié • Communauté Islamique en RDC
                </span>
              </div>

              <div className="flex items-center gap-3">
                <div className="hidden md:flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-lg text-xs">
                  <MapPin className="w-3.5 h-3.5 text-emerald-700" />
                  <span className="text-slate-500">Périmètre :</span>
                  <select
                    value={activeLevelFilter}
                    onChange={(e) => setActiveLevelFilter(e.target.value)}
                    className="bg-transparent font-bold text-slate-800 focus:outline-none"
                  >
                    <option>National (Toutes provinces)</option>
                    <option>Province de Kinshasa</option>
                    <option>Province du Nord-Kivu</option>
                    <option>Province du Haut-Katanga</option>
                    <option>Province de la Tshopo</option>
                  </select>
                </div>
                <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs font-semibold">
                  <Lock className="w-3 h-3" /> Session Locale Persistance Active
                </span>
              </div>
            </header>

            <main className="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
              {activeTab === 'dashboard' && (
                <DashboardView
                  financialStats={financialStats}
                  splitRules={splitRules}
                  certificatesCount={certificates.length}
                  onNavigate={setActiveTab}
                  isAdminRegistrar={isAdminRegistrar}
                  onToggleAdminRegistrar={() => {
                    setIsAdminRegistrar((prev) => !prev);
                    pushNotification(
                      !isAdminRegistrar
                        ? 'Droit d’enregistrement activé pour le Chargé de l’Adm.'
                        : 'Droit d’enregistrement verrouillé.'
                    );
                  }}
                />
              )}
              {activeTab === 'structure' && (
                <StructureView
                  organs={organs}
                  isAdminRegistrar={isAdminRegistrar}
                  onSaveOrgan={handleSaveOrgan}
                  onUpdateOrgan={handleUpdateOrgan}
                  onDeleteOrgan={handleDeleteOrgan}
                  onPublishOrgans={handlePublishOrgans}
                  onNotify={pushNotification}
                />
              )}
              {activeTab === 'mosques' && (
                <MosquesView
                  mosques={mosques}
                  onAddMosque={handleAddMosque}
                  onDeleteMosque={handleDeleteMosque}
                  onNotify={pushNotification}
                />
              )}
              {activeTab === 'members' && (
                <MembersView
                  members={members}
                  mosques={mosques}
                  onCreateMember={handleCreateMember}
                  onDeleteMember={handleDeleteMember}
                />
              )}
              {activeTab === 'leaders' && (
                <LeadersView
                  leaders={leaders}
                  mosques={mosques}
                  onAddLeader={handleAddLeader}
                  onDeleteLeader={handleDeleteLeader}
                />
              )}
              {activeTab === 'finance' && (
                <FinanceView
                  transactions={transactions}
                  financialStats={financialStats}
                  splitRules={splitRules}
                  onRecordTransaction={handleRecordTransaction}
                />
              )}
              {activeTab === 'events' && <EventsView events={events} onAddEvent={handleAddEvent} />}
              {activeTab === 'certificates' && (
                <CertificatesView
                  certificates={certificates}
                  leaders={leaders}
                  onGenerateCertificate={handleGenerateCertificate}
                />
              )}
              {activeTab === 'audit' && <AuditView auditLogs={auditLogs} />}
              {activeTab === 'admin' && (
                <AdminView
                  splitRules={splitRules}
                  onUpdateSplit={handleUpdateSplit}
                  onResetData={handleResetData}
                />
              )}
              {activeTab === 'madrasas' && <MadrasasView madrasas={madrasas} />}
              {activeTab === 'waqf' && <WaqfView waqfs={waqfs} />}
              {activeTab === 'hajj' && (
                <HajjView hajjPilgrims={hajjPilgrims} onRegisterPilgrim={handleRegisterPilgrim} />
              )}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
