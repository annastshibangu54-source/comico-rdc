    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(INITIAL_STATE);
        return { ...structuredClone(INITIAL_STATE), ...JSON.parse(raw) };
      } catch {
        return structuredClone(INITIAL_STATE);
      }
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {}
    }

    function notify(msg) {
      state.notification = msg;
      saveState();
      renderApp();
      setTimeout(() => {
        state.notification = null;
        renderApp();
      }, 3800);
    }

      state.auditLogs.unshift({

        acteur: 'Chargé de l’Administration',

        province,
        module,
        action,
        details,
        ip: '197.242.118.42',
        audio: '',
        video: '',
        image: ''
      });
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function downloadJson(filename, data) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function readFileAsDataUrl(input, callback) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => callback(reader.result);
      reader.readAsDataURL(file);
    }

    // Générateur de matrice QR visuelle déterministe à partir du texte
    function buildQrSvg(text, size = 54) {
      const n = 15;
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      const cell = size / n;
      let rects = `<rect width="${size}" height="${size}" fill="#ffffff"/>`;

      const drawFinder = (gx, gy) => {
        rects += `<rect x="${gx * cell}" y="${gy * cell}" width="${5 * cell}" height="${5 * cell}" fill="#064e3b"/>`;
        rects += `<rect x="${(gx + 1) * cell}" y="${(gy + 1) * cell}" width="${3 * cell}" height="${3 * cell}" fill="#ffffff"/>`;
        rects += `<rect x="${(gx + 2) * cell}" y="${(gy + 2) * cell}" width="${1 * cell}" height="${1 * cell}" fill="#064e3b"/>`;
      };

      drawFinder(0, 0);
      drawFinder(n - 5, 0);
      drawFinder(0, n - 5);

      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          const inTopLeft = r < 5 && c < 5;
          const inTopRight = r < 5 && c >= n - 5;
          const inBottomLeft = r >= n - 5 && c < 5;
          if (inTopLeft || inTopRight || inBottomLeft) continue;
          const bit = ((hash >>> ((r * n + c) % 31)) ^ (r * 7 + c * 13 + text.length)) & 1;
          if (bit === 1) {
            rects += `<rect x="${c * cell}" y="${r * cell}" width="${cell}" height="${cell}" fill="#0f172a"/>`;
          }
        }
      }

      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="rounded border border-slate-300 bg-white shrink-0" aria-label="QR Code">${rects}</svg>`;
    }

    // --- Actions Point 1 : Organigramme Hiérarchique ---
    function handleSaveOrgan(e) {
      e.preventDefault();
      const f = state.organForm;
      if (!f.nom.trim()) return;

      if (f.id) {
        state.organs = state.organs.map((o) => (o.id === f.id ? { ...o, ...f, effectifBureau: Number(f.effectifBureau) || 1 } : o));
        state.selectedOrganId = f.id;
        addAudit('Structure et organes', 'MODIFICATION_ORGANE', `Modification de ${f.nom} (${f.niveau})`, f.province);
        notify('Organe et autorité hiérarchique modifiés et enregistrés.');
      } else {
        const newId = `ORG-${Date.now()}`;
        const created = {
          ...f,
          id: newId,
          code: f.code.trim() || `COMICO-${f.niveau.slice(0, 3).toUpperCase()}-${Math.floor(10 + Math.random() * 89)}`,
          effectifBureau: Number(f.effectifBureau) || 1,
          publie: false
        };
        state.organs.push(created);
        state.selectedOrganId = newId;
        addAudit('Structure et organes', 'ENREGISTREMENT_ORGANE', `Enregistrement de ${created.nom} (${created.niveau})`, created.province);
        notify('Nouvel organe et autorité hiérarchique enregistrés.');
      }

      state.organForm = {
        id: '',
        code: '',
        nom: '',
        niveau: 'Provincial',
        parentId: state.organs[0]?.id || '',
        province: 'Kinshasa',
        urbainTerritorial: '',
        mosquee: '',
        siege: '',
        autorite: '',
        mandat: '2025 - 2029',
        statut: 'Actif',
        effectifBureau: 9
      };
      saveState();
      renderApp();
    }

    function editOrgan(id) {
      const target = state.organs.find((o) => o.id === id);
      if (!target) return;
      state.organForm = { ...target };
      state.selectedOrganId = id;
      saveState();
      renderApp();
    }

    function deleteOrgan(id) {
      if (state.organs.length <= 1) {
        notify('Impossible de supprimer le dernier organe racine.');
        return;
      }
      state.organs = state.organs.filter((o) => o.id !== id && o.parentId !== id);
      if (state.selectedOrganId === id) {
        state.selectedOrganId = state.organs[0]?.id || '';
      }
      addAudit('Structure et organes', 'SUPPRESSION_ORGANE', `Suppression de l'organe ${id}`);
      notify('Organe supprimé.');
      saveState();
      renderApp();
    }

    function publishOrganigramme() {
      state.organs = state.organs.map((o) => ({ ...o, publie: true }));
      addAudit('Structure et organes', 'PUBLICATION_ORGANIGRAMME', 'Publication officielle de l’organigramme hiérarchique');
      notify('Organigramme hiérarchique publié et mis à jour dans la section ci-dessous.');
      saveState();
      renderApp();
    }

      if (f.id) {
        state.mosques = state.mosques.map((m) => (m.id === f.id ? { ...m, ...f, capaciteAccueil: Number(f.capaciteAccueil) || 0 } : m));
        addAudit('Mosquées', 'MISE_A_JOUR_MOSQUEE', `Mise à jour de ${f.nom}`, f.province);
        notify('Mosquée mise à jour au patrimoine.');
      } else {
        const created = {
          ...f,
          id: `MSQ-${f.province.slice(0, 3).toUpperCase()}-${Math.floor(100 + Math.random() * 899)}`,
          capaciteAccueil: Number(f.capaciteAccueil) || 0

        state.mosques.unshift(created);
        addAudit('Mosquées', 'ENREGISTREMENT_PATRIMOINE', `Enregistrement au patrimoine : ${created.nom} (${created.province})`, created.province);
        notify('Mosquée enregistrée au patrimoine.');
      }

      state.showMosqueForm = false;
      state.mosqueForm = {
        id: '',
        nom: '',
        province: 'Kinshasa',
        villeTerritoire: '',
        adressePhysique: '',

      renderApp();

    function buildCertificateNote(cert) {
      if (cert.noteHierarchie && cert.noteHierarchie.trim()) {
        return cert.noteHierarchie.trim();
      }
      const signataire = cert.imamSignataire || 'la Hiérarchie Habilité du COMICO';
      const mosquee = cert.mosquee || 'la Mosquée désignée';
      const province = cert.province || 'RDC';
      const dateStr = cert.dateEmission || '';
      const benef = cert.beneficiaire || 'le/la bénéficiaire';

      if (cert.type === 'Acte de Mariage Religieux (Nikah)') {
        return `Note officielle de la Hiérarchie : Sous réserve des dispositions canoniques et réglementaires en vigueur au sein du COMICO • RDC, l’union religieuse (Nikah) de ${benef} célébrée à ${mosquee} (${province}) en date du ${dateStr} est certifiée conforme et soumise à la signature et au sceau de ${signataire}.`;
      }
      if (cert.type === 'Certificat de Conversion / Shahada') {
        return `Note officielle de la Hiérarchie : Il est attesté que ${benef} a prononcé librement et en pleine conscience la Shahada à ${mosquee} (${province}) le ${dateStr}. Document établi pour valoir ce que de droit, soumis à la signature de ${signataire}.`;
      }
      return `Note officielle de la Hiérarchie : La présente attestation d’Imamat concerne ${benef} au sein de ${mosquee} (${province}) à compter du ${dateStr}, établie pour signature et authentification par ${signataire}.`;
    }

              <div class="flex gap-2">
                <input type="number" placeholder="Élèves" value="${escapeHtml(f.eleves)}" oninput="state.madrasaForm.eleves = this.value" class="w-1/2 px-2 py-2 border rounded-lg" />
                <input type="number" placeholder="Ens." value="${escapeHtml(f.enseignants)}" oninput="state.madrasaForm.enseignants = this.value" class="w-1/2 px-2 py-2 border rounded-lg" />
              </div>
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Niveau & Réussite</label>
              <input type="text" value="${escapeHtml(f.niveau)}" oninput="state.madrasaForm.niveau = this.value" class="w-full px-3 py-2 border rounded-lg" />
            </div>
          </form>

          <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm print-data-only space-y-2 text-xs">
            <h3 class="font-bold text-sm text-slate-900 mb-2">Établissements & Madrasas (${state.madrasas.length})</h3>
            ${state.madrasas.map(m => `
              <div onclick="state.selectedMadrasaId = '${m.id}'; saveState(); renderApp();" class="p-3.5 rounded-lg border cursor-pointer ${selId === m.id ? 'bg-emerald-50 border-emerald-600' : 'bg-slate-50 border-slate-200'}">
                <p class="font-bold text-slate-900">${escapeHtml(m.id)} — ${escapeHtml(m.nom)} (${escapeHtml(m.province)})</p>
                <p class="text-slate-600 mt-1">Direction : <strong>${escapeHtml(m.directeur || '—')}</strong> • Élèves : <strong>${Number(m.eleves).toLocaleString()}</strong> • Enseignants : <strong>${Number(m.enseignants).toLocaleString()}</strong> • Niveau : ${escapeHtml(m.niveau)} • Réussite : ${escapeHtml(m.tauxReussite)}</p>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // --- Pôle : Action Sociale & Waqf ---
    function renderWaqf() {
      const f = state.waqfForm;
      const selId = state.selectedWaqfId || state.waqfs[0]?.id || '';
      return `
        <div class="space-y-6">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div>
              <h2 class="text-xl font-bold text-slate-900">Action Sociale & Waqf</h2>
              <p class="text-sm text-slate-500">Gestion des biens habous (Waqf) et œuvres sociales</p>
            </div>
            ${renderActionButtons({
              formId: 'waqf-form',
              onModify: `if('${selId}') editWaqf('${selId}')`,
              onDelete: `if('${selId}') deleteWaqf('${selId}')`,
              downloadName: 'waqf-action-sociale-comico.json',
              downloadData: 'state.waqfs'
            })}
          </div>

          <form id="waqf-form" onsubmit="handleSaveWaqf(event)" class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm grid grid-cols-1 md:grid-cols-4 gap-3 text-xs">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Désignation *</label>
              <input required type="text" value="${escapeHtml(f.designation)}" oninput="state.waqfForm.designation = this.value" class="w-full px-3 py-2 border rounded-lg" />
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Province</label>
              <select onchange="state.waqfForm.province = this.value" class="w-full px-3 py-2 border rounded-lg">
                ${PROVINCES_RDC.map(p => `<option value="${p}" ${f.province === p ? 'selected' : ''}>${p}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Revenu Mensuel (USD)</label>
              <input type="number" value="${escapeHtml(f.revenuMensuelUSD)}" oninput="state.waqfForm.revenuMensuelUSD = this.value" class="w-full px-3 py-2 border rounded-lg" />
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Affectation du Revenu</label>
              <input type="text" value="${escapeHtml(f.affectationRevenu)}" oninput="state.waqfForm.affectationRevenu = this.value" class="w-full px-3 py-2 border rounded-lg" />
            </div>
          </form>

          <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm print-data-only space-y-2 text-xs">
            <h3 class="font-bold text-sm text-slate-900 mb-2">Registre Waqf & Action Sociale (${state.waqfs.length})</h3>
            ${state.waqfs.map(w => `
              <div onclick="state.selectedWaqfId = '${w.id}'; saveState(); renderApp();" class="p-3.5 rounded-lg border cursor-pointer ${selId === w.id ? 'bg-emerald-50 border-emerald-600' : 'bg-slate-50 border-slate-200'}">
                <p class="font-bold text-slate-900">${escapeHtml(w.id)} — ${escapeHtml(w.designation)} (${escapeHtml(w.province)})</p>
                <p class="text-slate-600 mt-1">Type : ${escapeHtml(w.type)} • Revenu mensuel : <strong>$${Number(w.revenuMensuelUSD).toLocaleString()} USD</strong> • Affectation : <strong>${escapeHtml(w.affectationRevenu)}</strong> • Statut : ${escapeHtml(w.statut)}</p>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // --- Point 14 : Pôle : Gestion Hajj & Omra RDC (+ image du candidat) ---
    function renderHajj() {
      const f = state.hajjForm;
      const selId = state.selectedHajjId || state.hajjPilgrims[0]?.id || '';
      return `
        <div class="space-y-6">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div>
              <h2 class="text-xl font-bold text-slate-900">Gestion Hajj & Omra RDC</h2>
              <p class="text-sm text-slate-500">Suivi des candidats pèlerins, forfaits, paiements et conformité sanitaire</p>
            </div>
            ${renderActionButtons({
              formId: 'hajj-form',
              onModify: `if('${selId}') editHajj('${selId}')`,
              onDelete: `if('${selId}') deleteHajj('${selId}')`,
              downloadName: 'hajj-omra-rdc-comico.json',
              downloadData: 'state.hajjPilgrims'
            })}
          </div>

          <form id="hajj-form" onsubmit="handleSaveHajj(event)" class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm grid grid-cols-1 md:grid-cols-5 gap-3 text-xs">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Nom du Candidat *</label>
              <input required type="text" value="${escapeHtml(f.nom)}" oninput="state.hajjForm.nom = this.value" class="w-full px-3 py-2 border rounded-lg" />
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">N° Passeport</label>
              <input type="text" value="${escapeHtml(f.passeport)}" oninput="state.hajjForm.passeport = this.value" class="w-full px-3 py-2 border rounded-lg" />
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Province & Forfait</label>
              <input type="text" value="${escapeHtml(f.forfait)}" oninput="state.hajjForm.forfait = this.value" class="w-full px-3 py-2 border rounded-lg" />
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Paiement (USD)</label>
              <input type="number" value="${escapeHtml(f.paiementUSD)}" oninput="state.hajjForm.paiementUSD = this.value" class="w-full px-3 py-2 border rounded-lg" />
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Image du Candidat</label>
              <input type="file" accept="image/*" onchange="readFileAsDataUrl(this, (res) => { state.hajjForm.photo = res; saveState(); renderApp(); })" class="w-full px-2 py-1.5 border rounded-lg bg-slate-50" />
            </div>
          </form>

          ${f.photo ? `
            <div class="bg-white p-3 rounded-xl border border-slate-200 inline-block">
              <img src="${f.photo}" alt="Aperçu Candidat" class="h-28 w-28 object-cover rounded" />
            </div>
          ` : ''}

          <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm print-data-only space-y-2 text-xs">
            <h3 class="font-bold text-sm text-slate-900 mb-2">Dossiers Hajj & Omra RDC (${state.hajjPilgrims.length})</h3>
            ${state.hajjPilgrims.map(h => `
              <div onclick="state.selectedHajjId = '${h.id}'; saveState(); renderApp();" class="p-3.5 rounded-lg border cursor-pointer flex items-center gap-3 ${selId === h.id ? 'bg-emerald-50 border-emerald-600' : 'bg-slate-50 border-slate-200'}">
                ${h.photo
                  ? `<img src="${h.photo}" alt="${escapeHtml(h.nom)}" class="w-14 h-14 rounded-lg object-cover border border-slate-300 shrink-0" />`
                  : `<div class="w-14 h-14 rounded-lg bg-slate-200 text-slate-600 flex items-center justify-center text-[9px] font-bold shrink-0">PHOTO</div>`
                }
                <div>
                  <p class="font-bold text-slate-900">${escapeHtml(h.id)} — ${escapeHtml(h.nom)} (${escapeHtml(h.province)})</p>
                  <p class="text-slate-600 mt-1">Passeport : <span class="font-mono">${escapeHtml(h.passeport)}</span> • Forfait : ${escapeHtml(h.forfait)} • Paiement : <strong>$${Number(h.paiementUSD).toLocaleString()} USD (${escapeHtml(h.statutPaiement)})</strong> • Vaccin Méningite : ${h.vaccinMeningite ? 'À jour' : 'À vérifier'}</p>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderMain() {
      switch (state.activeTab) {
        case 'dashboard': return renderDashboard();
        case 'structure': return renderStructure();
        case 'mosques': return renderMosques();
        case 'members': return renderMembers();
        case 'leaders': return renderLeaders();
        case 'finance': return renderFinance();
        case 'events': return renderEvents();
        case 'certificates': return renderCertificates();
        case 'audit': return renderAudit();
        case 'admin': return renderAdmin();
        case 'madrasas': return renderMadrasas();
        case 'waqf': return renderWaqf();
        case 'hajj': return renderHajj();
        default: return renderDashboard();
      }
    }

    function renderApp() {
      const navSections = [
        {
          title: 'Pilotage & Vue Globale',
          items: [{ id: 'dashboard', label: 'Tableau de Bord' }]
        },
        {
          title: 'Gouvernance & Registres (09 Rubriques)',
          items: [
            { id: 'structure', label: '1. Structure et organes', badge: state.organs.length },
            { id: 'mosques', label: '2. Mosquées', badge: state.mosques.length },
            { id: 'members', label: '3. Membres', badge: state.members.length },
            { id: 'leaders', label: '4. Responsables religieux', badge: state.leaders.length },
            { id: 'finance', label: '5. Finance & Zakat', badge: state.transactions.length },
            { id: 'events', label: '6. Événements et fêtes', badge: state.events.length },
            { id: 'certificates', label: '7. Attestations religieuses', badge: state.certificates.length },
            { id: 'audit', label: "8. Journal d'audit", badge: state.auditLogs.length },
            { id: 'admin', label: '9. Administration' }
          ]
        },
        {
          title: 'Pôles Opérationnels Complémentaires',
          items: [
            { id: 'madrasas', label: 'Enseignement & Madrasas', badge: state.madrasas.length, href: 'edu-comico.html' },
            { id: 'waqf', label: 'Action Sociale & Waqf', badge: state.waqfs.length },
            { id: 'hajj', label: 'Gestion Hajj & Omra RDC', badge: state.hajjPilgrims.length }
          ]
        }
      ];

      document.getElementById('app').innerHTML = `
        <div class="min-h-screen bg-slate-100 text-slate-900 flex flex-col lg:flex-row font-sans">
          ${state.notification ? `
            <div class="fixed bottom-5 right-5 z-50 bg-emerald-950 text-white px-4 py-3 rounded-xl shadow-2xl border border-amber-400/50 text-sm max-w-md no-print">
              ${escapeHtml(state.notification)}
            </div>
          ` : ''}

          <aside class="fixed inset-y-0 left-0 z-40 w-72 bg-emerald-950 text-emerald-50 flex flex-col transition-transform duration-200 lg:static lg:translate-x-0 ${state.mobileMenuOpen ? 'translate-x-0' : '-translate-x-full'}">
            <div class="p-5 border-b border-emerald-900 flex items-center justify-between">
              <div>
                <h1 class="font-extrabold text-base tracking-tight text-white">COMICO • RDC</h1>
                <p class="text-[11px] text-amber-300 font-medium">Administration Islamique</p>
              </div>
              <button type="button" onclick="state.mobileMenuOpen = false; renderApp();" class="lg:hidden text-emerald-300 text-sm font-bold">✕</button>
            </div>
            <div class="flex-1 overflow-y-auto p-3 space-y-5">
              ${navSections.map((sec) => `
                <div>
                  <p class="px-3 text-[10px] font-bold uppercase tracking-wider text-emerald-400/80 mb-1.5">${escapeHtml(sec.title)}</p>
                  <div class="space-y-1">
                    ${sec.items.map((item) => {
                      const active = state.activeTab === item.id;
                      const clickHandler = item.href
                        ? `window.location.href = '${item.href}';`
                        : `state.activeTab = '${item.id}'; state.mobileMenuOpen = false; saveState(); renderApp();`;
                      return `
                        <button type="button" onclick="${clickHandler}" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold transition ${active ? 'bg-emerald-800 text-white border border-emerald-700' : 'text-emerald-100/80 hover:bg-emerald-900/60 hover:text-white'}">
                          <span class="truncate">${escapeHtml(item.label)}</span>
                          ${item.badge !== undefined ? `<span class="px-2 py-0.5 text-[10px] rounded-full bg-emerald-900 text-amber-300 font-bold">${item.badge}</span>` : ''}
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          </aside>

          <div class="flex-1 flex flex-col min-w-0">
            <nav class="bg-white border-b border-slate-200 px-4 sm:px-6 py-2.5 no-print">
              <div class="flex flex-wrap items-center justify-between gap-3">
                <a href="index.html" class="flex items-center gap-2.5 shrink-0">
                  <img src="img/logo1.jpg" alt="Logo COMICO-RDC" class="h-10 w-auto object-contain rounded" />
                  <span class="text-lg font-extrabold tracking-tight text-slate-900">
                    COMICO<span class="text-emerald-700">RDC</span>
                  </span>
                </a>
                <button type="button" onclick="state.topNavOpen = !state.topNavOpen; renderApp();" class="lg:hidden px-3 py-1.5 rounded-lg border border-slate-200 text-slate-700 text-xs font-semibold">
                  Menu
                </button>
                <div class="${state.topNavOpen ? 'flex' : 'hidden'} lg:flex flex-col lg:flex-row lg:items-center gap-1 lg:gap-4 w-full lg:w-auto text-xs font-semibold text-slate-700">
                  <a href="index.html" class="px-2.5 py-1.5 rounded-lg text-emerald-800 bg-emerald-50">Accueil</a>
                  <a href="about" class="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">À propos</a>
                  <a href="activities" class="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">Activités</a>
                  <a href="events" class="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">Événements</a>
                  <a href="sermons" class="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">Sermons</a>
                  <a href="gestion.html" class="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">Gestion</a>
                  <a href="edu_comico.html" class="px-2.5 py-1.5 rounded-lg hover:text-emerald-800 hover:bg-slate-50">Madrass</a>
                  <a href="#contact" class="px-3.5 py-2 rounded-lg bg-emerald-800 hover:bg-emerald-900 text-white text-xs font-semibold">Nous Contacter</a>
                </div>
              </div>
            </nav>

            <header class="bg-white border-b border-slate-200 px-4 sm:px-6 py-3.5 flex items-center justify-between gap-4 sticky top-0 z-30">
              <div class="flex items-center gap-3">
                <button type="button" onclick="state.mobileMenuOpen = true; renderApp();" class="lg:hidden p-2 rounded-lg border border-slate-200 text-slate-700 text-xs font-bold">☰</button>
                <span class="text-xs text-slate-500 font-medium">Système d’Information Unifié • Communauté Islamique en RDC</span>
              </div>
              <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs font-semibold">
                ${escapeHtml(getHeaderBadgeText())}
              </span>
            </header>

            <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
              ${renderMain()}
            </main>
          </div>
        </div>
      `;
    }

    renderApp();
  </script>
</body>
</html>
